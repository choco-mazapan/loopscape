# Builds the installer from the tagged source on GitHub's Windows runner, so anyone can check in the Actions log
# that the release came from this code. The installer also gets a signed build provenance attestation, which
# `gh attestation verify Loopscape-Setup-<version>.exe --repo choco-mazapan/loopscape` checks offline against
# this workflow and commit. Pushing a tag like v1.0.0 makes a DRAFT release with the installer and
# SHA256SUMS.txt (publish it by hand after a look); a manual run just uploads the installer as a build artifact.
# Inputs, all checked against SHA-256 values in the repo:
#   build/deps.json                       mpv and Rainmeter's installer
#   installer/styles-SHA256SUMS.txt       the videos and stills on the styles release (build/make-styles-release.ps1)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write       # build provenance attestation (Sigstore signing certificate)
  attestations: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Styles release (videos and stills)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ((Get-Content installer/styles-SHA256SUMS.txt -First 1) -replace '^#\s*', '').Trim()
          # the installer bundles HEVC videos (H.264 for styles without one); Loopscape downloads other formats itself
          gh release download $tag --dir build/deps/styles --clobber --pattern '*.hevc.mp4' --pattern '*.h264.mp4' --pattern loop.mp4 --pattern stills.zip

      - name: Dependencies (checked against build/deps.json and installer/styles-SHA256SUMS.txt)
        shell: pwsh
        run: ./build/get-deps.ps1

      - name: Unpack mpv
        shell: pwsh
        run: |
          $a = Get-ChildItem build/deps -Filter *.7z | Select-Object -First 1
          7z x $a.FullName -obuild/deps/mpv -y | Out-Null
          if (-not (Test-Path build/deps/mpv/mpv.exe)) { throw 'mpv.exe not found in the archive' }

      - name: Stage
        shell: pwsh
        run: |
          $rm = Get-ChildItem build/deps -Filter Rainmeter-*.exe | Select-Object -First 1
          ./build/stage.ps1 -StylesDir build/deps/styles -LoopMp4 build/deps/styles/loop.mp4 `
            -StillsZip build/deps/styles/stills.zip -MpvDir build/deps/mpv -RainmeterSetup $rm.FullName

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" installer/Loopscape.iss
          if ($LASTEXITCODE) { throw 'iscc failed' }
          $exe = Get-Item build/Loopscape-Setup-*.exe
          "$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant())  $($exe.Name)" | Set-Content build/SHA256SUMS.txt -Encoding ascii
          Get-Content build/SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/Loopscape-Setup-*.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            build/Loopscape-Setup-*.exe
            build/SHA256SUMS.txt

      - name: Draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $ver = '${{ steps.ver.outputs.version }}'
          # The notes list the pull requests merged since the previous app release. The previous release is looked up
          # by its v* tag, so a styles-v* release in between doesn't cut the list short.
          $prev = gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -like 'v*' -and $_ -ne $tag } | Select-Object -First 1
          $notes = "Download **Loopscape-Setup-$ver.exe** below and run it. If you already have Loopscape, it installs " +
            "over it and keeps your settings and videos. SHA256SUMS.txt has the installer's checksum, and " +
            "``gh attestation verify Loopscape-Setup-$ver.exe --repo choco-mazapan/loopscape`` confirms that this " +
            "workflow built it from this tag."
          $notesArgs = @('--generate-notes')
          if ($prev) { $notesArgs += @('--notes-start-tag', $prev) }
          # --latest: once published, this becomes the release that /releases/latest (the README's download link
          # and the tray menu's Update Loopscape) opens.
          gh release create $tag (Get-Item build/Loopscape-Setup-*.exe).FullName build/SHA256SUMS.txt `
            --draft --latest --title "Loopscape $ver" --notes $notes @notesArgs
          if ($LASTEXITCODE) { throw 'gh release create failed' }
