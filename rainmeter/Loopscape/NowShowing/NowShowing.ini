; Loopscape - Now Showing widget for Rainmeter: the wallpaper style on screen (with its first frame as a thumbnail),
; why it's playing and when the rotation changes it, plus previous / pause / next / keep-this-style buttons.
; Loopscape writes %LOCALAPPDATA%\Loopscape\wallstatus.txt (read by nowshowing.lua once a second); the buttons append commands to
; %LOCALAPPDATA%\Loopscape\wallcmd.txt, which Loopscape picks up right away (it watches the file).

[Rainmeter]
; Ticks once a second. While the mouse is over the widget, MeasureFastTick runs the snap logic every 100 ms
; so dragging and dropping still feel instant (see MouseOverAction below).
; Meters don't update on the tick: Rainmeter only redraws when a meter updated, so the widget is redrawn when
; nowshowing.lua sees a new status, not every second.
; Measures that must run on the tick say so with their own UpdateDivider.
Update=#UpdateMs#
DefaultUpdateDivider=-1
AccurateText=1
; Snapping keeps the widget on screen; Rainmeter's own nudging would look like a drag
OnRefreshAction=[!KeepOnScreen 0]
OnCloseAction=#SnapOnClose#
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#CONFIGEDITOR#" "#CURRENTPATH#NowShowing.ini"]
ContextTitle2=Settings...
ContextAction2=#OpenSettings#
ContextTitle3=Next wallpaper (Win+Alt+N)
ContextAction3=[!CommandMeasure MeasureNow "Cmd('next')"]
ContextTitle4=Previous wallpaper
ContextAction4=[!CommandMeasure MeasureNow "Cmd('prev')"]
ContextTitle5=View: Full
ContextAction5=[!CommandMeasure MeasureSnap "SetView(0)"]
ContextTitle6=View: Simple (name and next change)
ContextAction6=[!CommandMeasure MeasureSnap "SetView(1)"]
; Middle-click anywhere on the widget switches between the two views
MiddleMouseUpAction=[!CommandMeasure MeasureSnap "ViewMenu($MouseX$, $MouseY$)"]
; Fast snap checks only while the mouse is over the widget (a drag always starts there), plus a short tail after it leaves
MouseOverAction=[!CommandMeasure MeasureFastTick "Stop 2"][!CommandMeasure MeasureFastTick "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureFastTick "Stop 1"][!CommandMeasure MeasureFastTick "Execute 2"]

[Metadata]
Name=Loopscape Now Showing
Information=The Loopscape wallpaper on screen, when it changes next, and buttons to skip, go back, pause or keep it.
Version=1.0
License=MIT

[Variables]
; Snapping (shared with the other widgets): margins and on/off live in @Resources\Snap.inc
@Include=#@#Snap.inc
; Shared preferences (edited by the Settings panel)
@Include2=#@#Settings.inc
; Widget size (Settings > Widgets > Widget size): Scale multiplies the sizes below
@Include3=#@#Scale.inc
; View: 0 Full (thumbnail, name, next change, buttons), 1 Simple (name and next change)
View=0
ViewNames=Full|Simple
; Set by snap.lua when stacked widgets match widths
MatchedWidth=0
UpdateMs=1000
TextFont=Space Grotesk
; Segoe MDL2 Assets ships with Windows 10 and 11 (previous / play / pause / next / pin glyphs)
IconFont=Segoe MDL2 Assets
HeadSize=(10*#Scale#)
TitleSize=(19*#Scale#)
SubSize=(12*#Scale#)
; Thumbnail (the style's first frame, @Resources is not involved: %USERPROFILE%\Loopscape\styles\<style>.png)
ThumbW=(96*#Scale#)
ThumbH=(54*#Scale#)
; Set by nowshowing.lua: 1 when the style has a thumbnail
ThumbOn=0
; Buttons
BtnW=(34*#Scale#)
BtnH=(28*#Scale#)
BtnGap=(6*#Scale#)
BtnSize=(12*#Scale#)
; The row of four buttons, the last one set a little apart
BtnRowW=(4*#BtnW#+3*#BtnGap#+(10*#Scale#))
; Set by nowshowing.lua: the button the mouse is over (0 none)
BtnHover=0
ColorMain=255,255,255,255
ColorSub=255,255,255,225
ColorLabel=255,255,255,150
ColorShadow=0,0,0,170
; Text pills (Settings > Text pills): shape and colour (colour is switched with the text colour)
PillColor=0,0,0,160
PillPadX=(6*#Scale#)
PillRadius=(7*#Scale#)
; Pills hug the letters instead of the text box. Space Grotesk's box is 1.28 em tall with the letters set low in it
; (0.28 em of space above the capitals, 0.09 em below the descenders), so a pill drawn around the box looked low and
; let descenders spill out. At FontSize pt the em is FontSize*4/3 px, which puts the capitals' top PillInkTop*FontSize
; px below the box top, the baseline PillCapBottom*FontSize, and the descenders' bottom PillInkBottom*FontSize.
PillInkTop=0.38
PillCapBottom=1.31
PillInkBottom=1.58
; Space between the letters and the pill's edge, top and bottom
PillInkPad=(3*#Scale#)
; Extra space under a title while pills are shown, so its pill and the next line's don't overlap
PillLineGap=(#PanelAlpha#=0 ? #TextPills#*6*#Scale# : 0)
; Per-pill colours (set by snap.lua's adaptive colour; per-line mode can colour each pill separately)
PillFill_MeterHead=0,0,0,160
PillFill_MeterName=0,0,0,160
PillFill_MeterInfo=0,0,0,160
PillFill_MeterBtn1=0,0,0,160
PillFill_MeterBtn2=0,0,0,160
PillFill_MeterBtn3=0,0,0,160
PillFill_MeterBtn4=0,0,0,160
; Panel colour: 8,10,18 with the darkness (alpha) from Settings.inc
PanelPadding=(14*#Scale#)
PanelRadius=(16*#Scale#)
; Top of the button row: below the thumbnail, and lower by PillLineGap when pills push the text down.
; It must come after PanelPadding and PillLineGap: Rainmeter fills in variables as it reads them, so an earlier line
; would keep their names as text, the formula would fail, and the buttons would sit at the top of the widget.
BtnRowY=(#PanelPadding#+#ThumbH#+(14*#Scale#)+#PillLineGap#)
SnapAttach=Loopscape\WiFi|below

; ---------------- Measures ----------------

; Reads %LOCALAPPDATA%\Loopscape\wallstatus.txt and fills in the text, thumbnail and button glyphs; Cmd() sends the buttons' commands
[MeasureNow]
Measure=Script
ScriptFile=#CURRENTPATH#nowshowing.lua
; reads wallstatus.txt once a second; it redraws only when something in it changed
UpdateDivider=(1000/#UpdateMs#)

; ---------------- Meters ----------------

; The width comes from the lines' widths, not their positions: in the right screen column the layout is mirrored
; against the panel's right edge, so the positions depend on the width
[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(Max(Max((#View#=0 ? #ThumbOn#*(#ThumbW#+(14*#Scale#)) : 0)+Max(Max([MeterName:W],[MeterInfo:W]),(#View#=1 ? 0 : [MeterHead:W])),(#View#=1 ? 0 : #BtnRowW#))+2*#PanelPadding#,#MatchedWidth#)),(#View#=1 ? [MeterInfo:Y]+[MeterInfo:H]+#PanelPadding#-(4*#Scale#) : #BtnRowY#+#BtnH#+#PanelPadding#),#PanelRadius# | Fill Color 8,10,18,#PanelAlpha# | StrokeWidth 0
DynamicVariables=1

; ----- text pills: rounded backgrounds behind each text line, only when the panel tint is off -----
[Pill_MeterHead]
Meter=Shape
X=([MeterHead:X]-#PillPadX#)
Y=([MeterHead:Y]+#PillInkTop#*#HeadSize#-#PillInkPad#)
Shape=Rectangle 0,0,([MeterHead:W]+#PillPadX#*2),((#PillCapBottom#-#PillInkTop#)*#HeadSize#+#PillInkPad#*2),#PillRadius# | Fill Color #PillFill_MeterHead# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#>=1 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterName]
Meter=Shape
X=([MeterName:X]-#PillPadX#)
Y=([MeterName:Y]+#PillInkTop#*#TitleSize#-#PillInkPad#)
Shape=Rectangle 0,0,([MeterName:W]+#PillPadX#*2),((#PillInkBottom#-#PillInkTop#)*#TitleSize#+#PillInkPad#*2),#PillRadius# | Fill Color #PillFill_MeterName# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterName:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterInfo]
Meter=Shape
X=([MeterInfo:X]-#PillPadX#)
Y=([MeterInfo:Y]+#PillInkTop#*#SubSize#-#PillInkPad#)
Shape=Rectangle 0,0,([MeterInfo:W]+#PillPadX#*2),((#PillInkBottom#-#PillInkTop#)*#SubSize#+#PillInkPad#*2),#PillRadius# | Fill Color #PillFill_MeterInfo# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterInfo:W]<2 ? 1 : 0)))
DynamicVariables=1

; Buttons always get a round backdrop (they're controls, not text), the pill colour when pills are on.
; The row starts at the left padding, or ends at the right padding in the right screen column (ColumnAlign).
[StyleBtnBack]
Group=V1
Hidden=(#View#>=1)
DynamicVariables=1
Y=#BtnRowY#

[Pill_MeterBtn1]
Meter=Shape
MeterStyle=StyleBtnBack
X=((#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-#BtnRowW# : #PanelPadding#)+0*(#BtnW#+#BtnGap#))
Shape=Rectangle 0,0,#BtnW#,#BtnH#,(#BtnH#/2) | Fill Color #PillFill_MeterBtn1# | StrokeWidth (#BtnHover#=1 ? (1.5*#Scale#) : 0) | Stroke Color #ColorSub#

[Pill_MeterBtn2]
Meter=Shape
MeterStyle=StyleBtnBack
X=((#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-#BtnRowW# : #PanelPadding#)+1*(#BtnW#+#BtnGap#))
Shape=Rectangle 0,0,#BtnW#,#BtnH#,(#BtnH#/2) | Fill Color #PillFill_MeterBtn2# | StrokeWidth (#BtnHover#=2 ? (1.5*#Scale#) : 0) | Stroke Color #ColorSub#

[Pill_MeterBtn3]
Meter=Shape
MeterStyle=StyleBtnBack
X=((#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-#BtnRowW# : #PanelPadding#)+2*(#BtnW#+#BtnGap#))
Shape=Rectangle 0,0,#BtnW#,#BtnH#,(#BtnH#/2) | Fill Color #PillFill_MeterBtn3# | StrokeWidth (#BtnHover#=3 ? (1.5*#Scale#) : 0) | Stroke Color #ColorSub#

[Pill_MeterBtn4]
Meter=Shape
MeterStyle=StyleBtnBack
; set a little apart: it changes the rotation, the others just move through it
X=((#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-#BtnRowW# : #PanelPadding#)+3*(#BtnW#+#BtnGap#)+(10*#Scale#))
Shape=Rectangle 0,0,#BtnW#,#BtnH#,(#BtnH#/2) | Fill Color #PillFill_MeterBtn4# | StrokeWidth (#BtnHover#=4 ? (1.5*#Scale#) : 0) | Stroke Color #ColorSub#

[StyleText]
FontFace=#TextFont#
AntiAlias=1
StringEffect=#TextEffect#
FontEffectColor=#ColorShadow#
FontColor=#ColorSub#
FontWeight=500
DynamicVariables=1

; ----- thumbnail: the style's first frame, with a thin frame; click it to open the Settings panel -----
; In the right screen column (ColumnAlign) the layout is mirrored: the thumbnail sits against the right padding and
; the text lines end just left of it.
[MeterThumb]
Meter=Image
Group=V1
Hidden=(#View#>=1 ? 1 : (#ThumbOn#=0 ? 1 : 0))
ImageName=
PreserveAspectRatio=2
X=(#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-#ThumbW# : #PanelPadding#)
Y=(#PanelPadding#+(1*#Scale#))
W=#ThumbW#
H=#ThumbH#
DynamicVariables=1
LeftMouseUpAction=#OpenSettings#
ToolTipText=Choose a wallpaper...

[MeterThumbFrame]
Meter=Shape
Group=V1
Hidden=(#View#>=1 ? 1 : (#ThumbOn#=0 ? 1 : 0))
Shape=Rectangle ([MeterThumb:X]-(0.5*#Scale#)),(#PanelPadding#+(0.5*#Scale#)),(#ThumbW#+(1*#Scale#)),(#ThumbH#+(1*#Scale#)),(4*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #ColorLabel#
DynamicVariables=1

[MeterHead]
Meter=String
Group=V1
Hidden=(#View#>=1)
MeterStyle=StyleText
Text=NOW SHOWING
X=(#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-(#View#=0 ? #ThumbOn#*(#ThumbW#+(14*#Scale#)) : 0)-[MeterHead:W] : #PanelPadding#+(#View#=0 ? #ThumbOn#*(#ThumbW#+(14*#Scale#)) : 0))
Y=(#PanelPadding#-(2*#Scale#))
FontSize=#HeadSize#
FontWeight=600
FontColor=#ColorLabel#
DynamicVariables=1

[MeterName]
Meter=String
MeterStyle=StyleText
Text=...
X=(#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-(#View#=0 ? #ThumbOn#*(#ThumbW#+(14*#Scale#)) : 0)-[MeterName:W] : #PanelPadding#+(#View#=0 ? #ThumbOn#*(#ThumbW#+(14*#Scale#)) : 0))
Y=(#View#=1 ? #PanelPadding# : #PanelPadding#+(13*#Scale#))
FontSize=#TitleSize#
FontColor=#ColorMain#
DynamicVariables=1
LeftMouseUpAction=#OpenSettings#

[MeterInfo]
Meter=String
MeterStyle=StyleText
Text=
X=(#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-(#View#=0 ? #ThumbOn#*(#ThumbW#+(14*#Scale#)) : 0)-[MeterInfo:W] : #PanelPadding#+(#View#=0 ? #ThumbOn#*(#ThumbW#+(14*#Scale#)) : 0))
Y=((#View#=1 ? #PanelPadding#+(29*#Scale#) : #PanelPadding#+(41*#Scale#))+#PillLineGap#)
FontSize=#SubSize#
DynamicVariables=1

; ----- buttons (glyph text set by nowshowing.lua: play/pause and pin/unpin follow Loopscape's state) -----
[StyleBtn]
FontFace=#IconFont#
FontSize=#BtnSize#
FontColor=#ColorMain#
StringAlign=CenterCenter
AntiAlias=1
StringEffect=None
Group=V1
Hidden=(#View#>=1)
W=#BtnW#
H=#BtnH#
Y=(#BtnRowY#+#BtnH#/2)
SolidColor=0,0,0,1
DynamicVariables=1

[MeterBtn1]
Meter=String
MeterStyle=StyleBtn
Text=[\xE892]
X=([Pill_MeterBtn1:X]+#BtnW#/2)
ToolTipText=Previous style
MouseOverAction=[!CommandMeasure MeasureNow "Hover(1)"]
MouseLeaveAction=[!CommandMeasure MeasureNow "Hover(0)"]
LeftMouseUpAction=[!CommandMeasure MeasureNow "Cmd('prev')"]

[MeterBtn2]
Meter=String
MeterStyle=StyleBtn
Text=[\xE769]
X=([Pill_MeterBtn2:X]+#BtnW#/2)
ToolTipText=Pause / play the animation
MouseOverAction=[!CommandMeasure MeasureNow "Hover(2)"]
MouseLeaveAction=[!CommandMeasure MeasureNow "Hover(0)"]
LeftMouseUpAction=[!CommandMeasure MeasureNow "TogglePause()"]

[MeterBtn3]
Meter=String
MeterStyle=StyleBtn
Text=[\xE893]
X=([Pill_MeterBtn3:X]+#BtnW#/2)
ToolTipText=Next style (Win+Alt+N)
MouseOverAction=[!CommandMeasure MeasureNow "Hover(3)"]
MouseLeaveAction=[!CommandMeasure MeasureNow "Hover(0)"]
LeftMouseUpAction=[!CommandMeasure MeasureNow "Cmd('next')"]

[MeterBtn4]
Meter=String
MeterStyle=StyleBtn
Text=[\xE718]
X=([Pill_MeterBtn4:X]+#BtnW#/2)
ToolTipText=Keep this style / rotate again
MouseOverAction=[!CommandMeasure MeasureNow "Hover(4)"]
MouseLeaveAction=[!CommandMeasure MeasureNow "Hover(0)"]
LeftMouseUpAction=[!CommandMeasure MeasureNow "TogglePin()"]

; Natural content width, read by snap.lua to match stacked widths
[MeasureNaturalWidth]
Measure=Calc
UpdateDivider=(1000/#UpdateMs#)
Formula=(Max((#View#=0 ? #ThumbOn#*(#ThumbW#+(14*#Scale#)) : 0)+Max(Max([MeterName:W],[MeterInfo:W]),(#View#=1 ? 0 : [MeterHead:W])),(#View#=1 ? 0 : #BtnRowW#))+2*#PanelPadding#)
DynamicVariables=1

; Runs snap.lua every 100 ms while the mouse is over the widget (2 min max), and for 2 s after it leaves.
; snap.lua also starts list 3 (50 ms) for the wallpaper fade, list 4 (16 ms, 2 min max) while the widget is
; being dragged, and list 5 (16 ms, 1 s max) while it glides into its spot after a drop.
; ActionList6: quick status reads for 3 s after a button press, so the widget shows the change right away.
[MeasureFastTick]
Measure=Plugin
Plugin=ActionTimer
UpdateDivider=(1000/#UpdateMs#)
ActionList1=Repeat Tick, 100, 1200
ActionList2=Repeat Tick, 100, 20
ActionList3=Repeat Tick, 50, 200
ActionList4=Repeat Tick, 16, 7200
ActionList5=Repeat Tick, 16, 60
ActionList6=Repeat Status, 150, 20
Tick=[!UpdateMeasure MeasureSnap]
Status=[!UpdateMeasure MeasureNow]
DynamicVariables=1
