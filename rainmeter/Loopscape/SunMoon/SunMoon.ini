; Loopscape - Sun & Moon widget for Rainmeter: the sun's path across today's sky (or the night until sunrise), the
; next sunrise / sunset, and the moon's phase. Sunrise and sunset come from WeatherFetch.exe (the clock's weather, cached
; for an hour, so this widget adds no extra downloads); the moon phase is worked out locally.

[Rainmeter]
; Ticks once a second. While the mouse is over the widget, MeasureFastTick runs the snap logic every 100 ms
; so dragging and dropping still feel instant (see MouseOverAction below).
; Meters don't update on the tick: Rainmeter only redraws when a meter updated, so the widget is redrawn when
; sunmoon.lua moves the sun or changes the text, not every second.
; Measures that must run on the tick say so with their own UpdateDivider.
Update=#UpdateMs#
DefaultUpdateDivider=-1
AccurateText=1
; Snapping keeps the widget on screen; Rainmeter's own nudging would look like a drag
OnRefreshAction=[!KeepOnScreen 0]
OnCloseAction=#SnapOnClose#
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#CONFIGEDITOR#" "#CURRENTPATH#SunMoon.ini"]
ContextTitle2=Settings...
ContextAction2=[!ActivateConfig "Loopscape\Settings" "Settings.ini"]
ContextTitle3=View: Full
ContextAction3=[!CommandMeasure MeasureSnap "SetView(0)"]
ContextTitle4=View: Simple (next sunrise or sunset)
ContextAction4=[!CommandMeasure MeasureSnap "SetView(1)"]
; Middle-click anywhere on the widget switches between the two views
MiddleMouseUpAction=[!CommandMeasure MeasureSnap "ViewMenu($MouseX$, $MouseY$)"]
; Fast snap checks only while the mouse is over the widget (a drag always starts there), plus a short tail after it leaves
MouseOverAction=[!CommandMeasure MeasureFastTick "Stop 2"][!CommandMeasure MeasureFastTick "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureFastTick "Stop 1"][!CommandMeasure MeasureFastTick "Execute 2"]

[Metadata]
Name=Loopscape Sun & Moon
Information=The sun's arc across the sky, the next sunrise or sunset, and the moon's phase.
Version=1.0
License=MIT

[Variables]
; Snapping (shared with the other widgets): margins and on/off live in @Resources\Snap.inc
@Include=#@#Snap.inc
; Shared preferences (edited by the Settings panel)
@Include2=#@#Settings.inc
; View: 0 Full (arc, sunrise / sunset, moon), 1 Simple (sunrise / sunset only)
View=0
ViewNames=Full|Simple
; Set by snap.lua when stacked widgets match widths
MatchedWidth=0
UpdateMs=1000
TextFont=Space Grotesk
HeadSize=10
TitleSize=19
SubSize=12
; How often to read the sun times (seconds; WeatherFetch answers from its cache, it fetches at most once an hour)
SunInterval=1800
; The arc: width and height
ArcW=220
ArcH=58
; Set by sunmoon.lua: the arc's radii, where the sun (or at night, the night's progress) is, the marker's fill
ArcRX=104
ArcRY=52
ArcBase=57
SunX=6
SunY=57
SunFill=6
; Set by sunmoon.lua: the moon icon (terminator width, which half is lit, crescent or gibbous)
MoonRX=7
MoonDarkX=0
MoonOp=Exclude
ColorMain=255,255,255,255
ColorSub=255,255,255,225
ColorLabel=255,255,255,150
ColorShadow=0,0,0,170
; Text pills (Settings > Text pills): shape and colour (colour is switched with the text colour)
PillColor=0,0,0,160
PillPadX=6
PillPadY=2
PillRadius=7
; Per-pill colours (set by snap.lua's adaptive colour; per-line mode can colour each pill separately)
PillFill_MeterHead=0,0,0,160
PillFill_MeterName=0,0,0,160
PillFill_MeterInfo=0,0,0,160
PillFill_MeterMoon=0,0,0,160
PanelPadding=14
PanelRadius=16
SnapAttach=

; ---------------- Measures ----------------

[MeasureSunRun]
Measure=Plugin
Plugin=RunCommand
Program="#@#WeatherFetch.exe"
Parameter=#WeatherUnit# "" "#WeatherLocation#" "#WeatherCity#"
DynamicVariables=1
State=Hide
OutputType=UTF8
Timeout=30000
; keeps its once-a-second update so the plugin reports a finished run promptly
UpdateDivider=(1000/#UpdateMs#)
FinishAction=[!UpdateMeasure MeasureSunMoon]

; Fires once at load, then every SunInterval seconds
[MeasureSunTimer]
Measure=Calc
Formula=1
UpdateDivider=(#SunInterval#*1000/#UpdateMs#)
OnUpdateAction=[!CommandMeasure MeasureSunRun "Run"]

; Places the sun on its arc and draws the moon phase; once a minute is plenty (and after each read)
[MeasureSunMoon]
Measure=Script
ScriptFile=#CURRENTPATH#sunmoon.lua
UpdateDivider=(60000/#UpdateMs#)

; ---------------- Meters ----------------

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(Max((Max(Max([MeterName:X]+[MeterName:W],[MeterInfo:X]+[MeterInfo:W]),(#View#=1 ? 0 : Max(#PanelPadding#+#ArcW#,[MeterMoon:X]+[MeterMoon:W])))+#PanelPadding#),#MatchedWidth#)),(#View#=1 ? [MeterInfo:Y]+[MeterInfo:H]+#PanelPadding#-4 : [MeterMoon:Y]+[MeterMoon:H]+#PanelPadding#-4),#PanelRadius# | Fill Color 8,10,18,#PanelAlpha# | StrokeWidth 0
DynamicVariables=1

; ----- text pills: rounded backgrounds behind each text line, only when the panel tint is off -----
[Pill_MeterHead]
Meter=Shape
X=([MeterHead:X]-#PillPadX#)
Y=([MeterHead:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterHead:W]+#PillPadX#*2),([MeterHead:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterHead# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#>=1 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterName]
Meter=Shape
X=([MeterName:X]-#PillPadX#)
Y=([MeterName:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterName:W]+#PillPadX#*2),([MeterName:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterName# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterName:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterInfo]
Meter=Shape
X=([MeterInfo:X]-#PillPadX#)
Y=([MeterInfo:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterInfo:W]+#PillPadX#*2),([MeterInfo:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterInfo# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterInfo:W]<2 ? 1 : 0)))
DynamicVariables=1

; (the moon pill also covers the moon icon in front of the text)
[Pill_MeterMoon]
Meter=Shape
X=(#PanelPadding#-#PillPadX#)
Y=([MeterMoon:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterMoon:X]+[MeterMoon:W]-#PanelPadding#+#PillPadX#*2),([MeterMoon:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterMoon# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#>=1 ? 1 : ([MeterMoon:W]<2 ? 1 : 0))))
DynamicVariables=1

[StyleText]
FontFace=#TextFont#
AntiAlias=1
StringEffect=#TextEffect#
FontEffectColor=#ColorShadow#
FontColor=#ColorSub#
FontWeight=500
DynamicVariables=1

[MeterHead]
Meter=String
Group=V1
Hidden=(#View#>=1)
MeterStyle=StyleText
Text=SUN & MOON
X=#PanelPadding#
Y=(#PanelPadding#-2)
FontSize=#HeadSize#
FontWeight=600
FontColor=#ColorLabel#

; The sky: horizon line, the whole path (dotted), the part already travelled, and the sun (a ring at night, for the
; night's progress towards sunrise)
[MeterArc]
Meter=Shape
Group=V1
Hidden=(#View#>=1)
X=#PanelPadding#
Y=(#PanelPadding#+20)
Shape=Line 0,#ArcBase#,#ArcW#,#ArcBase# | StrokeWidth 1 | Stroke Color #ColorLabel#
Shape2=Path PathAll | StrokeWidth 1.5 | Stroke Color #ColorLabel# | Fill Color 0,0,0,0 | StrokeDashes 1,3 | StrokeDashCap Round
PathAll=(#ArcW#/2-#ArcRX#),#ArcBase# | ArcTo (#ArcW#/2+#ArcRX#),#ArcBase#,#ArcRX#,#ArcRY#
Shape3=Path PathDone | StrokeWidth 2.5 | Stroke Color #ColorMain# | Fill Color 0,0,0,0 | StrokeStartCap Round | StrokeEndCap Round
PathDone=(#ArcW#/2-#ArcRX#),#ArcBase# | ArcTo #SunX#,#SunY#,#ArcRX#,#ArcRY#
Shape4=Ellipse #SunX#,#SunY#,6.5,6.5 | Fill Color 0,0,0,0 | StrokeWidth 1.5 | Stroke Color #ColorMain#
Shape5=Ellipse #SunX#,#SunY#,#SunFill#,#SunFill# | Fill Color #ColorMain# | StrokeWidth 0
DynamicVariables=1

[MeterName]
Meter=String
MeterStyle=StyleText
Text=...
X=#PanelPadding#
Y=(#View#=1 ? #PanelPadding# : #PanelPadding#+20+#ArcH#+6)
FontSize=#TitleSize#
FontColor=#ColorMain#

[MeterInfo]
Meter=String
MeterStyle=StyleText
Text=
X=#PanelPadding#
Y=(#View#=1 ? #PanelPadding#+29 : #PanelPadding#+20+#ArcH#+6+29)
FontSize=#SubSize#

; Moon phase: dim outline, and the lit part (the disc, minus the dark half, plus or minus the terminator's ellipse)
[MeterMoonIcon]
Meter=Shape
Group=V1
Hidden=(#View#>=1)
X=#PanelPadding#
Y=([MeterMoon:Y]+[MeterMoon:H]/2-10)
Shape=Ellipse 8,10,7,7 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #ColorLabel#
Shape2=Ellipse 8,10,7,7 | Fill Color #ColorMain# | StrokeWidth 0
Shape3=Rectangle #MoonDarkX#,2,8,16 | StrokeWidth 0
Shape4=Ellipse 8,10,#MoonRX#,7 | StrokeWidth 0
Shape5=Combine Shape2 | Exclude Shape3 | #MoonOp# Shape4
DynamicVariables=1

[MeterMoon]
Meter=String
Group=V1
Hidden=(#View#>=1)
MeterStyle=StyleText
Text=
X=(#PanelPadding#+22)
Y=([MeterInfo:Y]+[MeterInfo:H]+4)
FontSize=#SubSize#

; Natural content width, read by snap.lua to match stacked widths
[MeasureNaturalWidth]
Measure=Calc
UpdateDivider=(1000/#UpdateMs#)
Formula=(Max(Max([MeterName:X]+[MeterName:W],[MeterInfo:X]+[MeterInfo:W]),(#View#=1 ? 0 : Max(#PanelPadding#+#ArcW#,[MeterMoon:X]+[MeterMoon:W])))+#PanelPadding#)
DynamicVariables=1

; Runs snap.lua every 100 ms while the mouse is over the widget (2 min max), and for 2 s after it leaves.
; snap.lua also starts list 3 (50 ms) for the wallpaper fade, list 4 (33 ms, 2 min max) while the widget is
; being dragged, and list 5 (16 ms, 1 s max) while it glides into its spot after a drop.
[MeasureFastTick]
Measure=Plugin
Plugin=ActionTimer
UpdateDivider=(1000/#UpdateMs#)
ActionList1=Repeat Tick, 100, 1200
ActionList2=Repeat Tick, 100, 20
ActionList3=Repeat Tick, 50, 200
ActionList4=Repeat Tick, 33, 3600
ActionList5=Repeat Tick, 16, 60
Tick=[!UpdateMeasure MeasureSnap]
DynamicVariables=1
