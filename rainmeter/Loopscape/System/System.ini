; Loopscape - System widget for Rainmeter: processor and memory use, and free space on drive C:.
; Rainmeter's own measures only (no script, nothing downloaded); read every 2 seconds, the drive every 30.

[Rainmeter]
; Ticks once a second. While the mouse is over the widget, MeasureFastTick runs the snap logic every 100 ms
; so dragging and dropping still feel instant (see MouseOverAction below).
Update=#UpdateMs#
DefaultUpdateDivider=(1000/#UpdateMs#)
AccurateText=1
; Snapping keeps the widget on screen; Rainmeter's own nudging would look like a drag
OnRefreshAction=[!KeepOnScreen 0]
OnCloseAction=#SnapOnClose#
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#CONFIGEDITOR#" "#CURRENTPATH#System.ini"]
ContextTitle2=Settings...
ContextAction2=[!ActivateConfig "Loopscape\Settings" "Settings.ini"]
ContextTitle3=Task Manager
ContextAction3=["taskmgr.exe"]
ContextTitle4=View: Full
ContextAction4=[!CommandMeasure MeasureSnap "SetView(0)"]
ContextTitle5=View: Simple (one line)
ContextAction5=[!CommandMeasure MeasureSnap "SetView(1)"]
; Middle-click anywhere on the widget switches between the two views
MiddleMouseUpAction=[!CommandMeasure MeasureSnap "ViewMenu($MouseX$, $MouseY$)"]
; Fast snap checks only while the mouse is over the widget (a drag always starts there), plus a short tail after it leaves
MouseOverAction=[!CommandMeasure MeasureFastTick "Stop 2"][!CommandMeasure MeasureFastTick "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureFastTick "Stop 1"][!CommandMeasure MeasureFastTick "Execute 2"]

[Metadata]
Name=Loopscape System
Information=Processor and memory use, and free space on drive C:.
Version=1.0
License=MIT

[Variables]
; Snapping (shared with the other widgets): margins and on/off live in @Resources\Snap.inc
@Include=#@#Snap.inc
; Shared preferences (edited by the Settings panel)
@Include2=#@#Settings.inc
; View: 0 Full (three bars), 1 Simple (one line)
View=0
ViewNames=Full|Simple
; Set by snap.lua when stacked widgets match widths
MatchedWidth=0
UpdateMs=1000
TextFont=Space Grotesk
HeadSize=10
SubSize=12
; Which drive's free space to show
Drive=C:
; Rows: label column, bar length and thickness, row height
LabelW=44
BarLen=130
BarH=6
RowH=24
ColorMain=255,255,255,255
ColorSub=255,255,255,225
ColorLabel=255,255,255,150
ColorShadow=0,0,0,170
; Text pills (Settings > Text pills): shape and colour (colour is switched with the text colour)
PillColor=0,0,0,160
PillPadX=6
PillPadY=2
PillRadius=7
; Per-pill colours (set by snap.lua's adaptive colour; per-line mode can colour each pill separately)
PillFill_MeterHead=0,0,0,160
PillFill_MeterL1=0,0,0,160
PillFill_MeterL2=0,0,0,160
PillFill_MeterL3=0,0,0,160
PillFill_MeterLine=0,0,0,160
PanelPadding=20
PanelRadius=16
SnapAttach=

; ---------------- Measures ----------------

[MeasureCPU]
Measure=CPU
UpdateDivider=(2000/#UpdateMs#)

[MeasureRAM]
Measure=PhysicalMemory
UpdateDivider=(2000/#UpdateMs#)

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[MeasureRAMPct]
Measure=Calc
Formula=(MeasureRAMTotal > 0 ? MeasureRAM / MeasureRAMTotal * 100 : 0)
UpdateDivider=(2000/#UpdateMs#)

[MeasureDiskFree]
Measure=FreeDiskSpace
Drive=#Drive#
UpdateDivider=(30000/#UpdateMs#)

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=#Drive#
Total=1
UpdateDivider=(30000/#UpdateMs#)

[MeasureDiskPct]
Measure=Calc
Formula=(MeasureDiskTotal > 0 ? (1 - MeasureDiskFree / MeasureDiskTotal) * 100 : 0)
UpdateDivider=(30000/#UpdateMs#)

[MeasureDiskGB]
Measure=Calc
Formula=MeasureDiskFree / 1073741824
UpdateDivider=(30000/#UpdateMs#)

; ---------------- Meters ----------------

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(Max((Max((#View#=1 ? #PanelPadding#+[MeterLine:W] : Max([MeterHead:X]+[MeterHead:W],Max([MeterV1:X]+[MeterV1:W],Max([MeterV2:X]+[MeterV2:W],[MeterV3:X]+[MeterV3:W])))),0)+#PanelPadding#),#MatchedWidth#)),(#View#=1 ? [MeterLine:Y]+[MeterLine:H]+#PanelPadding#-4 : [MeterL3:Y]+[MeterL3:H]+#PanelPadding#-4),#PanelRadius# | Fill Color 8,10,18,#PanelAlpha# | StrokeWidth 0
DynamicVariables=1

; ----- text pills, only when the panel tint is off: one per row (label, bar and value) -----
[StyleRowPill]
Group=V1
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#>=1 ? 1 : 0)))
X=(#PanelPadding#-#PillPadX#)
DynamicVariables=1

[Pill_MeterHead]
Meter=Shape
X=([MeterHead:X]-#PillPadX#)
Y=([MeterHead:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterHead:W]+#PillPadX#*2),([MeterHead:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterHead# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#>=1 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterL1]
Meter=Shape
MeterStyle=StyleRowPill
Y=([MeterL1:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterV1:X]+[MeterV1:W]-#PanelPadding#+#PillPadX#*2),([MeterL1:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterL1# | StrokeWidth 0

[Pill_MeterL2]
Meter=Shape
MeterStyle=StyleRowPill
Y=([MeterL2:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterV2:X]+[MeterV2:W]-#PanelPadding#+#PillPadX#*2),([MeterL2:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterL2# | StrokeWidth 0

[Pill_MeterL3]
Meter=Shape
MeterStyle=StyleRowPill
Y=([MeterL3:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterV3:X]+[MeterV3:W]-#PanelPadding#+#PillPadX#*2),([MeterL3:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterL3# | StrokeWidth 0

[Pill_MeterLine]
Meter=Shape
X=([MeterLine:X]-#PillPadX#)
Y=([MeterLine:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterLine:W]+#PillPadX#*2),([MeterLine:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterLine# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#=0 ? 1 : 0)))
DynamicVariables=1

[StyleText]
FontFace=#TextFont#
AntiAlias=1
StringEffect=#TextEffect#
FontEffectColor=#ColorShadow#
FontColor=#ColorSub#
FontWeight=500
DynamicVariables=1

[MeterHead]
Meter=String
Group=V1
Hidden=(#View#>=1)
MeterStyle=StyleText
Text=SYSTEM
X=#PanelPadding#
Y=(#PanelPadding#-2)
FontSize=#HeadSize#
FontWeight=600
FontColor=#ColorLabel#

; ----- rows: label, bar (outline + fill), value -----
[StyleLabel]
Group=V1
Hidden=(#View#>=1)
X=#PanelPadding#
FontSize=#SubSize#
FontColor=#ColorLabel#

[StyleValue]
Group=V1
Hidden=(#View#>=1)
X=(#PanelPadding#+#LabelW#+#BarLen#+10)
FontSize=#SubSize#
FontColor=#ColorMain#
NumOfDecimals=0

[StyleBar]
Group=V1
Hidden=(#View#>=1)
X=(#PanelPadding#+#LabelW#)
DynamicVariables=1

[MeterL1]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=CPU
Y=(#PanelPadding#+18)

[MeterB1]
Meter=Shape
MeterStyle=StyleBar
Y=([MeterL1:Y]+[MeterL1:H]/2-#BarH#/2)
Shape=Rectangle 0.5,0.5,#BarLen#,#BarH#,(#BarH#/2) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #ColorLabel#
Shape2=Rectangle 0.5,0.5,(Max(#BarH#,#BarLen#*Clamp([MeasureCPU],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #ColorMain# | StrokeWidth 0

[MeterV1]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureCPU
Text=%1%
Y=([MeterL1:Y])

[MeterL2]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=RAM
Y=([MeterL1:Y]+#RowH#)

[MeterB2]
Meter=Shape
MeterStyle=StyleBar
Y=([MeterL2:Y]+[MeterL2:H]/2-#BarH#/2)
Shape=Rectangle 0.5,0.5,#BarLen#,#BarH#,(#BarH#/2) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #ColorLabel#
Shape2=Rectangle 0.5,0.5,(Max(#BarH#,#BarLen#*Clamp([MeasureRAMPct],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #ColorMain# | StrokeWidth 0

[MeterV2]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureRAMPct
Text=%1%
Y=([MeterL2:Y])

[MeterL3]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=#Drive#
Y=([MeterL2:Y]+#RowH#)

[MeterB3]
Meter=Shape
MeterStyle=StyleBar
Y=([MeterL3:Y]+[MeterL3:H]/2-#BarH#/2)
Shape=Rectangle 0.5,0.5,#BarLen#,#BarH#,(#BarH#/2) | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #ColorLabel#
Shape2=Rectangle 0.5,0.5,(Max(#BarH#,#BarLen#*Clamp([MeasureDiskPct],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #ColorMain# | StrokeWidth 0

[MeterV3]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureDiskGB
Text=%1 GB free
Y=([MeterL3:Y])

; ----- Simple view: one line -----
[MeterLine]
Meter=String
MeterStyle=StyleText
Hidden=(#View#=0)
MeasureName=MeasureCPU
MeasureName2=MeasureRAMPct
MeasureName3=MeasureDiskGB
NumOfDecimals=0
Text=CPU %1%  [\x00B7]  RAM %2%  [\x00B7]  #Drive# %3 GB free
; left, centred or right-aligned with the screen column the widget is in (ColumnAlign)
X=(#ColumnAlign#=1 ? Trunc(([MeterPanel:W]-[MeterLine:W])/2) : (#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-[MeterLine:W] : #PanelPadding#))
Y=#PanelPadding#
FontSize=#SubSize#
FontColor=#ColorMain#

; Natural content width, read by snap.lua to match stacked widths
[MeasureNaturalWidth]
Measure=Calc
Formula=((#View#=1 ? #PanelPadding#+[MeterLine:W] : Max([MeterHead:X]+[MeterHead:W],Max([MeterV1:X]+[MeterV1:W],Max([MeterV2:X]+[MeterV2:W],[MeterV3:X]+[MeterV3:W]))))+#PanelPadding#)
DynamicVariables=1

; Runs snap.lua every 100 ms while the mouse is over the widget (2 min max), and for 2 s after it leaves
[MeasureFastTick]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Tick, 100, 1200
ActionList2=Repeat Tick, 100, 20
ActionList3=Repeat Tick, 50, 200
Tick=[!UpdateMeasure MeasureSnap]
DynamicVariables=1
