; Loopscape - clock, battery and weather widget for Rainmeter
; Fonts (in @Resources\Fonts, loaded automatically): Geist Pixel Circle (clock), Space Grotesk (text) - both SIL OFL.
; Weather: @Resources\WeatherFetch.exe (a typed city or Windows location + Open-Meteo), refreshed at most once an hour.

[Rainmeter]
; Ticks once a second. While the mouse is over the widget, MeasureFastTick runs the snap logic every 100 ms
; so dragging and dropping still feel instant (see MouseOverAction below).
; Meters don't update on the tick: Rainmeter only redraws when a meter updated, so the widget is redrawn when its
; text changes (MeasureMinute, MeasureBatteryText, weather.lua, snap.lua) instead of every second. Measures that
; must run on the tick say so with their own UpdateDivider.
Update=#UpdateMs#
DefaultUpdateDivider=-1
AccurateText=1
; Snapping keeps the widget on screen; Rainmeter's own nudging would look like a drag
OnRefreshAction=[!KeepOnScreen 0]
OnCloseAction=#SnapOnClose#
DynamicWindowSize=1
; Right-click > Edit variables opens this file
ContextTitle=Edit variables
ContextAction=["#CONFIGEDITOR#" "#CURRENTPATH#Clock.ini"]
ContextTitle2=Refresh weather now
ContextAction2=[!SetVariable WeatherForce force][!UpdateMeasure MeasureWeatherRun][!CommandMeasure MeasureWeatherRun "Run"][!SetVariable WeatherForce ""][!UpdateMeasure MeasureWeatherRun]
ContextTitle3=Settings...
ContextAction3=[!ActivateConfig "Loopscape\Settings" "Settings.ini"]
ContextTitle4=Next wallpaper (Win+Alt+N)
ContextAction4=[!CommandMeasure MeasureSnap "NextWallpaper()"]
ContextTitle5=View: Full
ContextAction5=[!CommandMeasure MeasureSnap "SetView(0)"]
ContextTitle6=View: Simple (time, weather, date, battery)
ContextAction6=[!CommandMeasure MeasureSnap "SetView(1)"]
ContextTitle7=View: Compact (time, date, battery)
ContextAction7=[!CommandMeasure MeasureSnap "SetView(2)"]
ContextTitle8=View: Time only
ContextAction8=[!CommandMeasure MeasureSnap "SetView(3)"]
ContextTitle9=Clock: switch 12-hour / 24-hour
ContextAction9=[!WriteKeyValue Variables ClockFormat (36-#ClockFormat#) "#@#Settings.inc"][!Refresh]
; Middle-click anywhere on the widget opens a small menu of views (or cycles when there are only two)
MiddleMouseUpAction=[!CommandMeasure MeasureSnap "ViewMenu($MouseX$, $MouseY$)"]
; Fast snap checks only while the mouse is over the widget (a drag always starts there), plus a short tail after it leaves
MouseOverAction=[!CommandMeasure MeasureFastTick "Stop 2"][!CommandMeasure MeasureFastTick "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureFastTick "Stop 1"][!CommandMeasure MeasureFastTick "Execute 2"]

[Metadata]
Name=Loopscape Clock
Information=24-hour clock, date, battery percentage, estimated time left and current weather.
Version=2.0
License=MIT

[Variables]
; Snapping (shared with the Wi-Fi widget): margins and on/off live in @Resources\Snap.inc
@Include=#@#Snap.inc
; Defaults for settings that older Settings.inc files don't have yet (Settings.inc, included next, overrides them)
WeatherLocation=city
WeatherCity=
DateFormat=%a, %#d %B
; Shared preferences (edited by the Settings panel)
@Include2=#@#Settings.inc
; View: 0 Full, 1 Simple (time, weather, date, battery), 2 Compact (time, date, battery), 3 Time only.
; Middle-click the widget for a menu of views, or use the right-click menu.
View=0
ViewNames=Full|Simple|Compact|Time only
; Set by snap.lua when stacked widgets match widths
MatchedWidth=0
; Set by snap.lua from the widget's screen column: 0 left, 1 centre, 2 right
ColumnAlign=0
UpdateMs=1000
ClockFont=Geist Pixel Circle
TextFont=Space Grotesk
ClockSize=66
DateSize=16
BatterySize=16
WeatherTempSize=24
WeatherDescSize=12
WeatherIconSize=48
ColorMain=255,255,255,255
ColorSub=255,255,255,225
ColorWarn=255,140,120,255
ColorShadow=0,0,0,170
; Icon colour (switched together with the text colour by snap.lua's SetTheme)
IconTint=255,255,255,255
; Weather icon colour set per icon, light (dark background) or deep (light background); snap.lua switches them
WxShade_MeterWeatherIcon=light
WxShade_MeterFcIcon1=light
WxShade_MeterFcIcon2=light
WxShade_MeterFcIcon3=light
; Weather icon drop shadow offset (snap.lua sets it from Text boost; see the Halo_ meters)
WxDropX=1
WxDropY=1
; Text pills (Settings > Text pills): shape and colour (colour is switched with the text colour)
PillColor=0,0,0,160
PillPadX=6
PillPadY=2
PillRadius=7
; Per-pill colours (set by snap.lua's adaptive colour; per-line mode can colour each pill separately)
PillFill_MeterAmPm=0,0,0,160
PillFill_MeterWeatherTemp=0,0,0,160
PillFill_MeterWeatherDesc=0,0,0,160
PillFill_MeterWeatherCity=0,0,0,160
PillFill_MeterDate=0,0,0,160
PillFill_MeterBattery=0,0,0,160
PillFill_MeterFcDay1=0,0,0,160
PillFill_MeterFcTemp1=0,0,0,160
PillFill_MeterFcDay2=0,0,0,160
PillFill_MeterFcTemp2=0,0,0,160
PillFill_MeterFcDay3=0,0,0,160
PillFill_MeterFcTemp3=0,0,0,160
ColorCity=255,255,255,170
; Backdrop panel behind the text (alpha 0 = no panel)
; Panel colour: 8,10,18 with the darkness (alpha) from Settings.inc
PanelPadding=14
PanelRadius=16
; Battery % at or below which the line turns ColorWarn (on battery only)
LowBattery=20
; Seconds between battery refreshes (the clock still updates every second)
BatteryInterval=5
; Seconds between weather refreshes (unit is in Settings.inc). WeatherFetch also caches for an hour on its own.
WeatherInterval=3600
WeatherForce=
; 3-day forecast row: column width, icon size, text size
ForecastColumn=112
ForecastIconSize=32
ForecastTextSize=13
SnapAttach=

; ---------------- Measures ----------------

; Time in both formats; MeterTime shows MeasureTime#ClockFormat# (ClockFormat is 24 or 12, from Settings.inc)
[MeasureTime24]
Measure=Time
Format=%H:%M
UpdateDivider=(1000/#UpdateMs#)

[MeasureTime12]
Measure=Time
Format=%#I:%M
UpdateDivider=(1000/#UpdateMs#)

[MeasureAmPm]
Measure=Time
Format=%p
UpdateDivider=(1000/#UpdateMs#)

; Date line in the format picked in Settings > Widgets > Date format (DateFormat in Settings.inc). The default has a
; short weekday ("Wed, 25 November") so the date stays clear of the weather column beside it. The Settings panel
; changes Format with !SetOption when you pick another one, so no DynamicVariables here.
[MeasureDate]
Measure=Time
Format=#DateFormat#
UpdateDivider=(1000/#UpdateMs#)

; Redraws the widget when the minute changes (the time, AM/PM and date only change then). It comes after the
; measures above so they already hold the new minute. Two meter passes: the panel and the pills come before the
; text they wrap, so the second pass picks up the new text widths. The AM/PM pill is updated once more: in the
; one-line view the AM/PM text only moves on the second pass, after its pill.
[MeasureMinute]
Measure=Time
Format=%Y%m%d%H%M
UpdateDivider=(1000/#UpdateMs#)
OnChangeAction=[!UpdateMeter *][!UpdateMeter *][!UpdateMeter Pill_MeterAmPm][!Redraw]

[MeasureACLine]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)

[MeasureStatus]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)

[MeasurePercent]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)

[MeasureLifetime]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Lifetime
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)

[MeasureBatteryText]
Measure=Script
ScriptFile=#CURRENTPATH#battery.lua
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)
; redraw only when the battery line changes (two passes, as in MeasureMinute)
OnChangeAction=[!UpdateMeter *][!UpdateMeter *][!Redraw]

; Runs the weather helper hidden; its output is parsed by weather.lua. The helper fetches location + weather at most
; once an hour and otherwise prints its cached result, so running it often is cheap. WeatherForce=force (set
; briefly by "Refresh weather now") skips the cache.
[MeasureWeatherRun]
Measure=Plugin
Plugin=RunCommand
Program="#@#WeatherFetch.exe"
Parameter=#WeatherUnit# "#WeatherForce#" "#WeatherLocation#" "#WeatherCity#"
DynamicVariables=1
State=Hide
OutputType=UTF8
Timeout=30000
; keeps its once-a-second update so the plugin reports a finished run promptly
UpdateDivider=(1000/#UpdateMs#)
FinishAction=[!UpdateMeasure MeasureWeather]

; Fires once at load, then every WeatherInterval seconds
[MeasureWeatherTimer]
Measure=Calc
Formula=1
UpdateDivider=(#WeatherInterval#*1000/#UpdateMs#)
OnUpdateAction=[!CommandMeasure MeasureWeatherRun "Run"]

[MeasureWeather]
Measure=Script
ScriptFile=#CURRENTPATH#weather.lua
UpdateDivider=-1

[MeasureWeatherTemp]
Measure=String
String=--
UpdateDivider=-1

; ---------------- Meters ----------------

; Translucent rounded panel sized to the content, so it stays readable on bright or busy wallpapers
[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(Max((Max(Max(#PanelPadding#+([MeterTime:W]+(#ClockFormat#=12 ? [MeterAmPm:W]+6 : 0)),Max((#View#>=2 ? 0 : [MeterWeatherTemp:X]+[MeterWeatherTemp:W]),(#View#>=1 ? 0 : Max([MeterWeatherDesc:X]+[MeterWeatherDesc:W],[MeterWeatherCity:X]+[MeterWeatherCity:W])))),Max((#View#>=3 ? 0 : Max([MeterDate:X]+[MeterDate:W],[MeterBattery:X]+[MeterBattery:W])),(#View#>=1 ? 0 : #PanelPadding#+3*#ForecastColumn#)))+#PanelPadding#),#MatchedWidth#)),(#View#>=3 ? [MeterTime:Y]+[MeterTime:H]+#PanelPadding#-12 : (#View#>=1 ? [MeterBattery:Y]+[MeterBattery:H]+#PanelPadding#-4 : [MeterFcTemp1:Y]+[MeterFcTemp1:H]+#PanelPadding#-4)),#PanelRadius# | Fill Color 8,10,18,#PanelAlpha# | StrokeWidth 0
DynamicVariables=1

; ----- invisible copies of fast-changing text, updated before the pills so each pill matches its text
; in the same update (pills read [Ghost_*:W]; position doesn't matter, only the width) -----
[Ghost_MeterBattery]
Meter=String
Hidden=(#View#>=3)
MeterStyle=StyleText
MeasureName=MeasureBatteryText
FontSize=#BatterySize#
FontWeight=500
DynamicVariables=1
X=0
Y=0
FontColor=0,0,0,0
StringEffect=None

; ----- text pills: rounded backgrounds behind each text line, only when the panel tint is off -----
; (placed before all text so they're drawn behind it; hidden when their text is hidden or empty)
[Pill_MeterAmPm]
Meter=Shape
X=([MeterAmPm:X]-#PillPadX#)
Y=([MeterAmPm:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterAmPm:W]+#PillPadX#*2),([MeterAmPm:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterAmPm# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterAmPm:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterWeatherTemp]
