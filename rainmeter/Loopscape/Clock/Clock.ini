; ----- weather column, to the right of the clock -----
; Outline and drop shadow for the weather icons, so they stay readable like the text does with Text boost.
; Each copy draws the icon as a flat silhouette (ColorMatrix) in the shadow colour: 1-8 are 1 px offsets that
; together form an outline, 9 is the drop shadow. snap.lua (iconHalo) sets their colour and strength from
; Text boost / Text effect, and weather.lua gives them the same image as the icon. Drawn before the icon.
[Halo_MeterWeatherIcon_1]
