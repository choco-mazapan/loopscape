X=([MeterWeatherTemp:X]-#PillPadX#)
Y=([MeterWeatherTemp:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterWeatherTemp:W]+#PillPadX#*2),([MeterWeatherTemp:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterWeatherTemp# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterWeatherTemp:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterWeatherDesc]
