MeterStyle=StyleText
MeasureName=MeasureTime#ClockFormat#
FontFace=#ClockFont#
; Time-only view: centre the time in the (possibly width-matched) panel in the centre column, right-align it in the right column
X=(#View#=3 ? (#ColumnAlign#=1 ? Trunc(([MeterPanel:W]-([MeterTime:W]+(#ClockFormat#=12 ? [MeterAmPm:W]+6 : 0)))/2) : (#ColumnAlign#=2 ? [MeterPanel:W]-([MeterTime:W]+(#ClockFormat#=12 ? [MeterAmPm:W]+6 : 0))-#PanelPadding# : #PanelPadding#)) : #PanelPadding#)
