; ----- tooltip areas: one invisible rectangle per tooltip, drawn over the text it explains -----
; Rainmeter opens a separate tooltip window for every meter that has ToolTipText. When the icon, day and
; temperature each had their own tooltip, their boxes overlapped (so two tooltips opened at once), and the gaps
; between them were fully transparent, so the mouse "fell through" the widget there and Windows never told the
; old tooltip to close. These areas are alpha 1 (invisible, but still under the mouse) and the forecast columns
; touch each other, so moving across the row always hands over from one tooltip to the next.
; weather.lua sets their ToolTipText.
[MeterWeatherTip]
Meter=Shape
Hidden=(#View#>=2)
X=([MeterWeatherIcon:X])
Y=(Min([MeterWeatherIcon:Y],[MeterWeatherTemp:Y]))
Shape=Rectangle 0,0,(Max([MeterWeatherTemp:X]+[MeterWeatherTemp:W],(#View#>=1 ? 0 : Max([MeterWeatherDesc:X]+[MeterWeatherDesc:W],[MeterWeatherCity:X]+[MeterWeatherCity:W])))-[MeterWeatherIcon:X]),((#View#>=1 ? Max([MeterWeatherIcon:Y]+[MeterWeatherIcon:H],[MeterWeatherTemp:Y]+[MeterWeatherTemp:H]) : [MeterWeatherCity:Y]+[MeterWeatherCity:H])-Min([MeterWeatherIcon:Y],[MeterWeatherTemp:Y])) | Fill Color 0,0,0,1 | StrokeWidth 0
DynamicVariables=1

[MeterFcTip1]
Meter=Shape
Hidden=(#View#>=1)
X=(#PanelPadding#+0*#ForecastColumn#)
Y=([MeterFcDay1:Y])
Shape=Rectangle 0,0,#ForecastColumn#,(Max([MeterFcIcon1:Y]+[MeterFcIcon1:H],[MeterFcTemp1:Y]+[MeterFcTemp1:H])-[MeterFcDay1:Y]) | Fill Color 0,0,0,1 | StrokeWidth 0
DynamicVariables=1

[MeterFcTip2]
Meter=Shape
Hidden=(#View#>=1)
X=(#PanelPadding#+1*#ForecastColumn#)
Y=([MeterFcDay2:Y])
Shape=Rectangle 0,0,#ForecastColumn#,(Max([MeterFcIcon2:Y]+[MeterFcIcon2:H],[MeterFcTemp2:Y]+[MeterFcTemp2:H])-[MeterFcDay2:Y]) | Fill Color 0,0,0,1 | StrokeWidth 0
DynamicVariables=1

[MeterFcTip3]
Meter=Shape
Hidden=(#View#>=1)
X=(#PanelPadding#+2*#ForecastColumn#)
Y=([MeterFcDay3:Y])
Shape=Rectangle 0,0,#ForecastColumn#,(Max([MeterFcIcon3:Y]+[MeterFcIcon3:H],[MeterFcTemp3:Y]+[MeterFcTemp3:H])-[MeterFcDay3:Y]) | Fill Color 0,0,0,1 | StrokeWidth 0
DynamicVariables=1

; Natural content width, read by snap.lua to match stacked widths (once a second, like snap.lua)
[MeasureNaturalWidth]
Measure=Calc
UpdateDivider=(1000/#UpdateMs#)
Formula=(Max(Max(#PanelPadding#+([MeterTime:W]+(#ClockFormat#=12 ? [MeterAmPm:W]+6 : 0)),Max((#View#>=2 ? 0 : [MeterWeatherTemp:X]+[MeterWeatherTemp:W]),(#View#>=1 ? 0 : Max([MeterWeatherDesc:X]+[MeterWeatherDesc:W],[MeterWeatherCity:X]+[MeterWeatherCity:W])))),Max((#View#>=3 ? 0 : Max([MeterDate:X]+[MeterDate:W],[MeterBattery:X]+[MeterBattery:W])),(#View#>=1 ? 0 : #PanelPadding#+3*#ForecastColumn#)))+#PanelPadding#)
DynamicVariables=1

; Runs snap.lua every 100 ms while the mouse is over the widget (2 min max), and for 2 s after it leaves.
; snap.lua also starts list 3 (50 ms) for the wallpaper fade, list 4 (33 ms, 2 min max) while the widget is
; being dragged, and list 5 (16 ms, 1 s max) while it glides into its spot after a drop.
[MeasureFastTick]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Tick, 100, 1200
ActionList2=Repeat Tick, 100, 20
ActionList3=Repeat Tick, 50, 200
ActionList4=Repeat Tick, 33, 3600
ActionList5=Repeat Tick, 16, 60
Tick=[!UpdateMeasure MeasureSnap]
UpdateDivider=(1000/#UpdateMs#)
DynamicVariables=1
