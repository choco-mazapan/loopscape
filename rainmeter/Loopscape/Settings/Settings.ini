; The text box (MeasureTextInput): what it starts with, and what was typed (settings.lua sets / reads them)
TextDefault=
TextInput=

[MeasureSettings]
Measure=Script
ScriptFile=#CURRENTPATH#settings.lua
; every second: refreshes "Playing now" from wallstatus.txt, or on the Look tab the update status from updatestatus.txt
UpdateDivider=1

; The panel's text box (Rainmeter's built-in InputText plugin), shared by the fields you type in: the weather city,
; a custom height for the bottom snap spots and profile names. settings.lua EditField() sets X, Y, W, H, InputNumber
; and TextDefault so it sits inside the clicked value button, inset by the button's padding. Enter saves; Esc or
; clicking elsewhere cancels. Both end in EndEdit(), which puts the button back.
[MeasureTextInput]
Measure=Plugin
Plugin=InputText
X=0
Y=0
W=0
H=0
InputNumber=0
; ColorPillHover as it looks over the panel (InputText can't blend), so the box and the button around it match
SolidColor=50,71,104,255
FontColor=#ColorMain#
; A plain Windows text box: it can't see the skin's bundled Space Grotesk, so use the closest system font
FontFace=Segoe UI
FontSize=12
StringAlign=Left
DefaultValue=#TextDefault#
DynamicVariables=1
Command1=[!SetVariable TextInput """$UserInput$"""][!CommandMeasure MeasureSettings "FieldEntered()"][!CommandMeasure MeasureSettings "EndEdit()"]
OnDismissAction=[!CommandMeasure MeasureSettings "EndEdit()"]

