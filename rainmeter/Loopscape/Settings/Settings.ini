; GENERATED by rainmeter\gen-settings-ini.ps1 - edit that instead.
; Loopscape settings panel. Opened from a widget's right-click menu (Settings...). Tabs: Wallpaper, Rotation, Widgets, Look, Profiles.
; Values are stored in @Resources\Settings.inc, which both widgets include. settings.lua does the work.

[Rainmeter]
; Ticks once a second only for MeasureSettings, which refreshes "Playing now" (Wallpaper tab) and the update status (Look tab). Nothing else updates on the tick.
Update=1000
DefaultUpdateDivider=-1
AccurateText=1
DynamicWindowSize=1
; Opens on top of other windows. Loopscape then makes it a normal window that others can cover (SettingsTaskbar.cs). [!ZPos 0] can't: with Rainmeter's default NormalStayDesktop it sends the skin behind every window.
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Loopscape Settings
Information=Click a value or tile to change it.
License=MIT

[Variables]
@Include=#@#Settings.inc
TextFont=Space Grotesk
; Layout: content is PanelWidth-2*Pad wide; tabs and wallpaper tiles share three columns (TileW + TileGap)
PanelWidth=460
PanelHeight=754
Pad=22
Y0=116
RowHeight=50
; Extra space between groups of related rows, with a thin line across the middle of it
GroupGap=16
; Widgets tab: where its setting rows start (below the widget tiles)
WRowsY=100
LabelW=250
TileW=134
; Widgets tab: four widget tiles across the content width: (PanelWidth - 2*Pad - 3*TileGap) / 4
WTileW=98.75
TileH=30
TileGap=7
; five tabs across the content width: (PanelWidth - 2*Pad - 4*TabGap) / 5
TabW=78.4
TabGap=6
; "Playing now" preview (16:9)
PrevW=192
PrevH=108
ColorMain=255,255,255,255
