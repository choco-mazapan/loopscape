; Loopscape - Network widget for Rainmeter (the config is still called WiFi, so existing setups keep working).
; On Wi-Fi: network name, signal, band/channel, link speed, standard, security and signal strength.
; On Ethernet: adapter name, link speed, gateway, DNS server and MAC address.
; Both: local IP, ping and live download/upload speed.
; Connection details come from @Resources\WifiInfo.exe (netsh-style output, parsed by wifi.lua) once a minute, and
; only in the views that show them.

[Rainmeter]
; Ticks once a second. While the mouse is over the widget, MeasureFastTick runs the snap logic every 100 ms
; so dragging and dropping still feel instant (see MouseOverAction below).
; Meters don't update on the tick. Only the live meters (group Live: ping and speeds) update every second, and only
; in the views that show them (MeasureLiveTick); the rest update when their text changes (wifi.lua, MeasureIP,
; snap.lua). Rainmeter only redraws when a meter updated, so the Simple view isn't redrawn every second at all.
; Measures that must run on the tick say so with their own UpdateDivider.
Update=#UpdateMs#
DefaultUpdateDivider=-1
AccurateText=1
; Snapping keeps the widget on screen; Rainmeter's own nudging would look like a drag
OnRefreshAction=[!KeepOnScreen 0]
OnCloseAction=#SnapOnClose#
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#CONFIGEDITOR#" "#CURRENTPATH#WiFi.ini"]
ContextTitle2=Refresh connection details now
ContextAction2=[!CommandMeasure MeasureNetsh "Run"]
ContextTitle3=Settings...
ContextAction3=[!ActivateConfig "Loopscape\Settings" "Settings.ini"]
ContextTitle4=Next wallpaper (Win+Alt+N)
ContextAction4=[!CommandMeasure MeasureSnap "NextWallpaper()"]
ContextTitle5=View: Full
ContextAction5=[!CommandMeasure MeasureSnap "SetView(0)"]
ContextTitle6=View: Simple (name and status)
ContextAction6=[!CommandMeasure MeasureSnap "SetView(1)"]
ContextTitle7=View: Speeds (ping, download and upload)
ContextAction7=[!CommandMeasure MeasureSnap "SetView(2)"]
; Middle-click anywhere on the widget opens a small menu of views
MiddleMouseUpAction=[!CommandMeasure MeasureSnap "ViewMenu($MouseX$, $MouseY$)"]
; Fast snap checks only while the mouse is over the widget (a drag always starts there), plus a short tail after it leaves
MouseOverAction=[!CommandMeasure MeasureFastTick "Stop 2"][!CommandMeasure MeasureFastTick "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureFastTick "Stop 1"][!CommandMeasure MeasureFastTick "Execute 2"]

[Metadata]
Name=Loopscape Network
Information=Current Wi-Fi or Ethernet connection details, matching the Loopscape clock widget.
Version=1.0
License=MIT

[Variables]
; Snapping (shared with the clock widget): margins and on/off live in @Resources\Snap.inc
@Include=#@#Snap.inc
; Shared preferences (edited by the Settings panel)
@Include2=#@#Settings.inc
; Widget size (Settings > Widgets > Widget size): Scale multiplies the sizes below
@Include3=#@#Scale.inc
; View: 0 Full, 1 Simple (name and status), 2 Speeds (ping and down/up speed only).
; (View 2 was called Network before the widget itself became the Network widget; the number is unchanged.)
; Middle-click the widget for a menu of views, or use the right-click menu.
View=2
ViewNames=Full|Simple|Speeds
; Set by snap.lua when stacked widgets match widths
MatchedWidth=0
UpdateMs=1000
TextFont=Space Grotesk
TitleSize=(19*#Scale#)
SubSize=(13*#Scale#)
LabelSize=(12*#Scale#)
ValueSize=(13*#Scale#)
LabelWidth=(92*#Scale#)
RowHeight=(21*#Scale#)
; Ping and speed columns are as wide as typical worst-case text in the real font (Tpl_* meters below), so the widget
; doesn't change size as the numbers change but has no dead space either; ColGap is the space between columns
; (the text itself is not fixed-width, so text pills hug each value)
PingSample=888 ms
SpeedSample=888.8 kB/s
ColGap=(20*#Scale#)
ColorMain=255,255,255,255
ColorSub=255,255,255,225
ColorLabel=255,255,255,150
ColorShadow=0,0,0,170
; Icon colour (switched together with the text colour by snap.lua's SetTheme)
IconTint=255,255,255,255
; Text pills (Settings > Text pills): shape and colour (colour is switched with the text colour)
PillColor=0,0,0,160
PillPadX=(6*#Scale#)
PillPadY=(2*#Scale#)
PillRadius=(7*#Scale#)
; Per-pill colours (set by snap.lua's adaptive colour; per-line mode can colour each pill separately)
PillFill_MeterSSID=0,0,0,160
PillFill_MeterQuality=0,0,0,160
PillFill_MeterL1=0,0,0,160
PillFill_MeterV1=0,0,0,160
PillFill_MeterL2=0,0,0,160
PillFill_MeterV2=0,0,0,160
PillFill_MeterL3=0,0,0,160
PillFill_MeterV3=0,0,0,160
PillFill_MeterL4=0,0,0,160
PillFill_MeterV4=0,0,0,160
PillFill_MeterL5=0,0,0,160
PillFill_MeterV5=0,0,0,160
PillFill_MeterL6=0,0,0,160
PillFill_MeterV6=0,0,0,160
PillFill_MeterL7=0,0,0,160
PillFill_MeterV7=0,0,0,160
PillFill_MeterTraffic=0,0,0,160
PillFill_MeterTrafficUp=0,0,0,160
; Panel colour: 8,10,18 with the darkness (alpha) from Settings.inc
PanelPadding=(14*#Scale#)
PanelRadius=(16*#Scale#)
; Seconds between connection detail refreshes (only in the Full and Simple views; see MeasureNetshTimer)
WifiInterval=60
; Host to ping for latency, and seconds between pings
PingHost=1.1.1.1
PingInterval=15
SnapAttach=Loopscape\Clock|below

; ---------------- Measures ----------------

; Runs @Resources\WifiInfo.exe hidden: on Wi-Fi it prints the same lines as "netsh wlan show interfaces" (UTF-8), but
; shows up as "Loopscape" in Windows' location settings (reading Wi-Fi names counts as location access). On a wired
; connection it prints the adapter's details instead and doesn't touch the Wi-Fi API.
[MeasureNetsh]
Measure=Plugin
Plugin=RunCommand
Program="#@#WifiInfo.exe"
Parameter=
State=Hide
OutputType=UTF8
Timeout=10000
; keeps its once-a-second update so the plugin reports a finished run promptly
UpdateDivider=(1000/#UpdateMs#)
FinishAction=[!UpdateMeasure MeasureWifi]

; Reads the connection details every WifiInterval seconds, but only in the views that show them (Full, Simple):
; Windows counts reading the Wi-Fi name as location access, and the Speeds view (ping and speeds) doesn't need it.
; snap.lua's SetView updates this measure on a view change, so switching back to Full/Simple reads them right away.
[MeasureNetshTimer]
Measure=Calc
Formula=#View#
DynamicVariables=1
UpdateDivider=(#WifiInterval#*1000/#UpdateMs#)
IfCondition=MeasureNetshTimer<2
IfTrueAction=[!CommandMeasure MeasureNetsh "Run"]
IfConditionMode=1

[MeasureWifi]
Measure=Script
ScriptFile=#CURRENTPATH#wifi.lua
UpdateDivider=-1

[MeasureIP]
Measure=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
; IP only changes on reconnect: look it up every 15 s instead of every second
UpdateDivider=(15*1000/#UpdateMs#)
; and redraw its row only when it changes (text first, then the pill that reads its width)
OnChangeAction=[!UpdateMeter MeterV6][!UpdateMeter Pill_MeterV6][!Redraw]
; No address while disconnected: show a dash
RegExpSubstitute=1
Substitute="^$":"-","^0\.0\.0\.0$":"-","^127\.0\.0\.1$":"-"

[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#PingHost#
UpdateRate=#PingInterval#
Timeout=3000
; the plugin counts updates for UpdateRate, so it keeps its once-a-second update
UpdateDivider=(1000/#UpdateMs#)
; No reply (offline / timed out) returns -1; show a plain dash instead of a number then
TimeoutValue=-1
IfCondition=MeasurePing <= 0
IfTrueAction=[!SetOption MeterV7 Text "-"][!SetOption Ghost_MeterV7 Text "-"][!UpdateMeter Ghost_MeterV7][!UpdateMeter MeterV7][!Redraw]
IfFalseAction=[!SetOption MeterV7 Text "%1 ms"][!SetOption Ghost_MeterV7 Text "%1 ms"][!UpdateMeter Ghost_MeterV7][!UpdateMeter MeterV7][!Redraw]

[MeasureDown]
Measure=NetIn
Interface=Best
UpdateDivider=(1000/#UpdateMs#)

[MeasureUp]
Measure=NetOut
Interface=Best
UpdateDivider=(1000/#UpdateMs#)

; Once a second, after the speeds are read: update the ping and speed meters (group Live) and redraw, in the views
; that show them (not the Simple view). Their widths don't change the panel (the columns are sized by Tpl_*), and
; their pills read the Ghost_* copies, so one pass is enough.
[MeasureLiveTick]
Measure=Calc
Formula=(#View#<>1)
DynamicVariables=1
UpdateDivider=(1000/#UpdateMs#)
IfCondition=MeasureLiveTick=1
IfTrueAction=[!UpdateMeterGroup Live][!Redraw]
IfConditionMode=1

; ---------------- Meters ----------------

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(Max((Max(Max([MeterSSID:X]+[MeterSSID:W],[MeterQuality:X]+[MeterQuality:W]),(#View#=1 ? 0 : Max(Max([MeterV1:X]+[MeterV1:W],[MeterV2:X]+[MeterV2:W]),Max([MeterV3:X]+[MeterV3:W],Max((#View#=2 ? #PanelPadding#+([Tpl_Ping:W]+#ColGap#+[Tpl_Speed:W]*2+#ColGap#) : 0),(#View#=0 ? #PanelPadding#+(260*#Scale#) : 0))))))+#PanelPadding#),#MatchedWidth#)),(#View#=1 ? #PanelPadding#*2+(48*#Scale#) : [MeterTraffic:Y]+[MeterTraffic:H]+#PanelPadding#-(4*#Scale#)),#PanelRadius# | Fill Color 8,10,18,#PanelAlpha# | StrokeWidth 0
DynamicVariables=1

; ----- invisible sample text that sets the ping / speed column widths (see PingSample / SpeedSample) -----
[Tpl_Ping]
Meter=String
Hidden=(#View#=1)
MeterStyle=StyleText | StyleValue
Text=#PingSample#
DynamicVariables=1
X=0
Y=0
FontColor=0,0,0,0
StringEffect=None

[Tpl_Speed]
Meter=String
Hidden=(#View#=1)
MeterStyle=StyleText
Text=[\x2193] #SpeedSample#
FontSize=#ValueSize#
DynamicVariables=1
X=0
Y=0
FontColor=0,0,0,0
StringEffect=None

; ----- invisible copies of fast-changing text, updated before the pills so each pill matches its text
; in the same update (pills read [Ghost_*:W]; position doesn't matter, only the width) -----
[Ghost_MeterV7]
Group=Live
Meter=String
Hidden=(#View#=1)
MeterStyle=StyleText | StyleValue
MeasureName=MeasurePing
Text=%1 ms
NumOfDecimals=0
DynamicVariables=1
X=0
Y=0
FontColor=0,0,0,0
StringEffect=None

[Ghost_MeterTraffic]
Group=Live
Meter=String
Hidden=(#View#=1)
MeterStyle=StyleText
MeasureName=MeasureDown
Text=[\x2193] %1B/s
AutoScale=1
NumOfDecimals=1
FontSize=#ValueSize#
DynamicVariables=1
X=0
Y=0
FontColor=0,0,0,0
StringEffect=None

[Ghost_MeterTrafficUp]
Group=Live
Meter=String
Hidden=(#View#=1)
MeterStyle=StyleText
MeasureName=MeasureUp
Text=[\x2191] %1B/s
AutoScale=1
NumOfDecimals=1
FontSize=#ValueSize#
DynamicVariables=1
X=0
Y=0
FontColor=0,0,0,0
StringEffect=None

