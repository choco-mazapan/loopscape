[MeterV7]
Group=Live
Meter=String
Hidden=(#View#=1)
MeterStyle=StyleText | StyleValue
MeasureName=MeasurePing
Text=%1 ms
NumOfDecimals=0
; Speeds view: one row - ping first, then the speeds, in fixed-width columns. Each text sits at the start, middle
; or end of its column for the screen column the widget is in (ColumnAlign), so the row lines up with the
; widgets stacked with it
X=(#View#=2 ? (#ColumnAlign#=1 ? Trunc(([MeterPanel:W]-([Tpl_Ping:W]+#ColGap#+[Tpl_Speed:W]*2+#ColGap#))/2) : (#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-([Tpl_Ping:W]+#ColGap#+[Tpl_Speed:W]*2+#ColGap#) : #PanelPadding#))+Trunc(#ColumnAlign#*([Tpl_Ping:W]-[Ghost_MeterV7:W])/2) : #PanelPadding#+#LabelWidth#)
Y=(#View#=2 ? #PanelPadding# : #PanelPadding#+(76*#Scale#)+6*#RowHeight#)
DynamicVariables=1

; Live traffic on the active connection

[MeterTraffic]
Group=Live
Meter=String
Hidden=(#View#=1)
MeterStyle=StyleText
MeasureName=MeasureDown
Text=[\x2193] %1B/s
AutoScale=1
NumOfDecimals=1
X=(#View#=2 ? (#ColumnAlign#=1 ? Trunc(([MeterPanel:W]-([Tpl_Ping:W]+#ColGap#+[Tpl_Speed:W]*2+#ColGap#))/2) : (#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-([Tpl_Ping:W]+#ColGap#+[Tpl_Speed:W]*2+#ColGap#) : #PanelPadding#))+[Tpl_Ping:W]+#ColGap#+Trunc(#ColumnAlign#*([Tpl_Speed:W]-[Ghost_MeterTraffic:W])/2) : #PanelPadding#)
Y=(#View#=2 ? #PanelPadding# : #PanelPadding#+(76*#Scale#)+7*#RowHeight#+(16*#Scale#))
FontSize=#ValueSize#
FontColor=#ColorMain#
DynamicVariables=1

[MeterTrafficUp]
Group=Live
Meter=String
Hidden=(#View#=1)
MeterStyle=StyleText
MeasureName=MeasureUp
Text=[\x2191] %1B/s
AutoScale=1
NumOfDecimals=1
X=(#View#=2 ? (#ColumnAlign#=1 ? Trunc(([MeterPanel:W]-([Tpl_Ping:W]+#ColGap#+[Tpl_Speed:W]*2+#ColGap#))/2) : (#ColumnAlign#=2 ? [MeterPanel:W]-#PanelPadding#-([Tpl_Ping:W]+#ColGap#+[Tpl_Speed:W]*2+#ColGap#) : #PanelPadding#))+[Tpl_Ping:W]+#ColGap#*2+[Tpl_Speed:W]+Trunc(#ColumnAlign#*([Tpl_Speed:W]-[Ghost_MeterTrafficUp:W])/2) : [MeterTraffic:X]+[Tpl_Speed:W]+#ColGap#)
Y=([MeterTraffic:Y])
FontSize=#ValueSize#
FontColor=#ColorMain#
DynamicVariables=1

; Natural content width, read by snap.lua to match stacked widths (once a second, like snap.lua)

[MeasureNaturalWidth]
Measure=Calc
UpdateDivider=(1000/#UpdateMs#)
Formula=(Max(Max([MeterSSID:X]+[MeterSSID:W],[MeterQuality:X]+[MeterQuality:W]),(#View#=1 ? 0 : Max(Max([MeterV1:X]+[MeterV1:W],[MeterV2:X]+[MeterV2:W]),Max([MeterV3:X]+[MeterV3:W],Max((#View#=2 ? #PanelPadding#+([Tpl_Ping:W]+#ColGap#+[Tpl_Speed:W]*2+#ColGap#) : 0),(#View#=0 ? #PanelPadding#+(260*#Scale#) : 0))))))+#PanelPadding#)
DynamicVariables=1

; Runs snap.lua every 100 ms while the mouse is over the widget (2 min max), and for 2 s after it leaves.
; snap.lua also starts list 3 (50 ms) for the wallpaper fade, list 4 (16 ms, 2 min max) while the widget is
; being dragged, and list 5 (16 ms, 1 s max) while it glides into its spot after a drop.
[MeasureFastTick]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Tick, 100, 1200
ActionList2=Repeat Tick, 100, 20
ActionList3=Repeat Tick, 50, 200
ActionList4=Repeat Tick, 16, 7200
ActionList5=Repeat Tick, 16, 60
Tick=[!UpdateMeasure MeasureSnap]
UpdateDivider=(1000/#UpdateMs#)
DynamicVariables=1
