; Small pop-up menu of a widget's views. Opened by middle-clicking a widget that has more than two views
; (snap.lua's ViewMenu sets Target/Names/Current, positions it under the cursor and calls Build()).
; Click a view to switch; moving the mouse off the menu closes it.

[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos 2][!Draggable 0][!KeepOnScreen 1]
MouseLeaveAction=[!DeactivateConfig]

[Metadata]
Name=Loopscape View Menu
Information=Pick a widget view.
License=MIT

[Variables]
Target=Loopscape\Clock
Names=Full|Simple
Current=0
Count=2
TextFont=Space Grotesk
; Same size as the widgets: WidgetScale from Settings.inc (0 if it isn't there yet), turned into #Scale# by Scale.inc
WidgetScale=0
@Include=#@#Settings.inc
@Include2=#@#Scale.inc
ItemW=(196*#Scale#)
ItemH=(30*#Scale#)
Pad=(8*#Scale#)
ColorItem=255,255,255,0
ColorCurrent=120,175,255,70
ColorHover=255,255,255,40
Base1=255,255,255,0
Base2=255,255,255,0
Base3=255,255,255,0
Base4=255,255,255,0
Base5=255,255,255,0
Base6=255,255,255,0

[MeasureMenu]
Measure=Script
ScriptFile=#CURRENTPATH#menu.lua

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(#ItemW#+#Pad#*2),(#Pad#*2+(24*#Scale#)+#Count#*#ItemH#),(12*#Scale#) | Fill Color 10,12,20,235 | StrokeWidth (1*#Scale#) | Stroke Color 255,255,255,45
DynamicVariables=1

[MeterTitle]
Meter=String
Text=View
FontFace=#TextFont#
FontSize=(10*#Scale#)
FontWeight=500
FontColor=255,255,255,140
AntiAlias=1
X=(#Pad#+(10*#Scale#))
Y=(#Pad#+(3*#Scale#))

[MeterItem1]
Meter=String
Text=
Hidden=1
FontFace=#TextFont#
FontSize=(12*#Scale#)
FontWeight=500
FontColor=255,255,255,240
AntiAlias=1
X=#Pad#
Y=(#Pad#+(24*#Scale#)+0*#ItemH#)
W=(#ItemW#-(20*#Scale#))
H=(#ItemH#-(12*#Scale#))
Padding=(10*#Scale#),(5*#Scale#),(10*#Scale#),(5*#Scale#)
SolidColor=#Base1#
MouseOverAction=[!SetOption MeterItem1 SolidColor #ColorHover#][!UpdateMeter MeterItem1][!Redraw]
MouseLeaveAction=[!SetOption MeterItem1 SolidColor #Base1#][!UpdateMeter MeterItem1][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureMenu "Pick(1)"]
DynamicVariables=1

