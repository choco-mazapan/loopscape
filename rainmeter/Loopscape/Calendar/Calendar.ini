[StyleText]
FontFace=#TextFont#
AntiAlias=1
StringEffect=#TextEffect#
FontEffectColor=#ColorShadow#
FontColor=#ColorSub#
FontWeight=500
DynamicVariables=1

; Month and year (click: back to this month)
[MeterHead]
Meter=String
Group=V1
Hidden=(#View#>=1)
MeterStyle=StyleText
Text=...
X=#PanelPadding#
Y=(#PanelPadding#-(4*#Scale#))
FontSize=#MonthSize#
FontWeight=600
FontColor=#ColorMain#
LeftMouseUpAction=[!CommandMeasure MeasureCalendar "Shift(0)"]

; Today's ring
[MeterToday]
Meter=Shape
Group=V1
Hidden=(#View#>=1 ? 1 : (#TodayOn#=0 ? 1 : 0))
X=(#PanelPadding#+#TodayCol#*#CellW#)
Y=(#PanelPadding#+#GridY#+#TodayRow#*#CellH#)
Shape=Rectangle (2*#Scale#),(1.5*#Scale#),(#CellW#-(4*#Scale#)),(#CellH#-(3*#Scale#)),((#CellH#-(3*#Scale#))/2) | Fill Color 0,0,0,0 | StrokeWidth (1.5*#Scale#) | Stroke Color #ColorMain#
DynamicVariables=1

; Weekday letters (set by calendar.lua in the order Windows starts the week)
[StyleWeekday]
Group=V1
Hidden=(#View#>=1)
StringAlign=CenterCenter
FontSize=#HeadSize#
FontWeight=600
FontColor=#ColorLabel#
Y=(#PanelPadding#+#GridY#-#CellH#/2+(2*#Scale#))

[StyleDay]
