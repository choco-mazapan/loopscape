; Loopscape - Calendar widget for Rainmeter: this month, with today ringed. Scroll over it to see other months;
; click the month to come back. The week starts on the day set in Windows (Settings > Time & language > Region).
; The day meters below are generated (one per cell, 6 weeks of 7 days); calendar.lua fills them in once a minute.

[Rainmeter]
; Ticks once a second. While the mouse is over the widget, MeasureFastTick runs the snap logic every 100 ms
; so dragging and dropping still feel instant (see MouseOverAction below).
; Meters don't update on the tick: Rainmeter only redraws when a meter updated, so the widget is redrawn when
; calendar.lua changes something (it checks once a minute) or you scroll to another month, not every second.
; Measures that must run on the tick say so with their own UpdateDivider.
Update=#UpdateMs#
DefaultUpdateDivider=-1
AccurateText=1
; Snapping keeps the widget on screen; Rainmeter's own nudging would look like a drag
OnRefreshAction=[!KeepOnScreen 0]
OnCloseAction=#SnapOnClose#
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#CONFIGEDITOR#" "#CURRENTPATH#Calendar.ini"]
ContextTitle2=Settings...
ContextAction2=[!ActivateConfig "Loopscape\Settings" "Settings.ini"]
ContextTitle3=Back to this month
ContextAction3=[!CommandMeasure MeasureCalendar "Shift(0)"]
ContextTitle4=View: Full
ContextAction4=[!CommandMeasure MeasureSnap "SetView(0)"]
ContextTitle5=View: Simple (today's date)
ContextAction5=[!CommandMeasure MeasureSnap "SetView(1)"]
; Middle-click anywhere on the widget switches between the two views
MiddleMouseUpAction=[!CommandMeasure MeasureSnap "ViewMenu($MouseX$, $MouseY$)"]
; Scroll for the previous / next month
MouseScrollUpAction=[!CommandMeasure MeasureCalendar "Shift(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureCalendar "Shift(1)"]
; Fast snap checks only while the mouse is over the widget (a drag always starts there), plus a short tail after it leaves
MouseOverAction=[!CommandMeasure MeasureFastTick "Stop 2"][!CommandMeasure MeasureFastTick "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureFastTick "Stop 1"][!CommandMeasure MeasureFastTick "Execute 2"]

[Metadata]
Name=Loopscape Calendar
Information=This month with today ringed; scroll for other months.
Version=1.0
License=MIT

[Variables]
; Snapping (shared with the other widgets): margins and on/off live in @Resources\Snap.inc
@Include=#@#Snap.inc
; Shared preferences (edited by the Settings panel)
@Include2=#@#Settings.inc
; Widget size (Settings > Widgets > Widget size): Scale multiplies the sizes below
@Include3=#@#Scale.inc
; View: 0 Full (the month), 1 Simple (today's date and week number)
View=0
ViewNames=Full|Simple
; Set by snap.lua when stacked widgets match widths
MatchedWidth=0
UpdateMs=1000
TextFont=Space Grotesk
MonthSize=(15*#Scale#)
DaySize=(11*#Scale#)
HeadSize=(9*#Scale#)
TitleSize=(19*#Scale#)
SubSize=(12*#Scale#)
; Grid cell size
CellW=(32*#Scale#)
CellH=(24*#Scale#)
; Top of the grid (below the month name and the weekday letters)
GridY=(50*#Scale#)
; Set by calendar.lua: weeks shown, where today's ring goes (TodayOn 0 when another month is shown)
Rows=5
TodayCol=0
TodayRow=0
TodayOn=0
ColorMain=255,255,255,255
ColorSub=255,255,255,225
ColorLabel=255,255,255,150
ColorShadow=0,0,0,170
; Text pills (Settings > Text pills): shape and colour (colour is switched with the text colour)
PillColor=0,0,0,160
PillPadX=(6*#Scale#)
PillPadY=(2*#Scale#)
PillRadius=(7*#Scale#)
PillFill_MeterHead=0,0,0,160
PillFill_MeterName=0,0,0,160
PillFill_MeterInfo=0,0,0,160
PanelPadding=(14*#Scale#)
PanelRadius=(16*#Scale#)
SnapAttach=

; ---------------- Measures ----------------

; First day of the week in Windows: 0 Monday ... 6 Sunday
[MeasureFirstDay]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Control Panel\International
RegValue=iFirstDayOfWeek
UpdateDivider=-1

[MeasureCalendar]
Measure=Script
ScriptFile=#CURRENTPATH#calendar.lua
UpdateDivider=(60000/#UpdateMs#)

; ---------------- Meters ----------------

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(Max((#View#=1 ? Max([MeterName:X]+[MeterName:W],[MeterInfo:X]+[MeterInfo:W])+#PanelPadding# : Max(#PanelPadding#*2+7*#CellW#,[MeterHead:X]+[MeterHead:W]+#PanelPadding#)),#MatchedWidth#)),(#View#=1 ? [MeterInfo:Y]+[MeterInfo:H]+#PanelPadding#-(4*#Scale#) : #PanelPadding#+#GridY#+#Rows#*#CellH#+#PanelPadding#-(8*#Scale#)),#PanelRadius# | Fill Color 8,10,18,#PanelAlpha# | StrokeWidth 0
DynamicVariables=1

; ----- text pills, only when the panel tint is off -----
[Pill_MeterHead]
Meter=Shape
X=([MeterHead:X]-#PillPadX#)
Y=([MeterHead:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterHead:W]+#PillPadX#*2),([MeterHead:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterHead# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#>=1 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterName]
Meter=Shape
X=([MeterName:X]-#PillPadX#)
Y=([MeterName:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterName:W]+#PillPadX#*2),([MeterName:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterName# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#=0 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterInfo]
Meter=Shape
X=([MeterInfo:X]-#PillPadX#)
Y=([MeterInfo:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterInfo:W]+#PillPadX#*2),([MeterInfo:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterInfo# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#=0 ? 1 : 0)))
DynamicVariables=1

; one pill per week, and one behind the weekday letters
[StyleRowPill]
Group=V1
X=(#PanelPadding#-#PillPadX#)
Shape=Rectangle 0,0,(7*#CellW#+#PillPadX#*2),(#CellH#-(4*#Scale#)),((#CellH#-(4*#Scale#))/2) | Fill Color #PillColor# | StrokeWidth 0
DynamicVariables=1

[Pill_Week0]
Meter=Shape
MeterStyle=StyleRowPill
Y=(#PanelPadding#+#GridY#-#CellH#+(4*#Scale#))
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#>=1 ? 1 : 0)))

[Pill_Week1]
Meter=Shape
MeterStyle=StyleRowPill
Y=(#PanelPadding#+#GridY#+0*#CellH#+(2*#Scale#))
