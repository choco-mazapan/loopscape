; Loopscape - Rain widget for Rainmeter: will it rain in the next 3 hours, and when does it start or stop.
; WeatherFetch.exe "nowcast" (Open-Meteo's 15-minute precipitation forecast for the weather location) every 15 minutes;
; the clock's weather shares the same download.

[Rainmeter]
; Ticks once a second. While the mouse is over the widget, MeasureFastTick runs the snap logic every 100 ms
; so dragging and dropping still feel instant (see MouseOverAction below).
; Meters don't update on the tick: Rainmeter only redraws when a meter updated, so the widget is redrawn when
; rain.lua has new text or bars, not every second.
; Measures that must run on the tick say so with their own UpdateDivider.
Update=#UpdateMs#
DefaultUpdateDivider=-1
AccurateText=1
; Snapping keeps the widget on screen; Rainmeter's own nudging would look like a drag
OnRefreshAction=[!KeepOnScreen 0]
OnCloseAction=#SnapOnClose#
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#CONFIGEDITOR#" "#CURRENTPATH#Rain.ini"]
ContextTitle2=Settings...
ContextAction2=[!ActivateConfig "Loopscape\Settings" "Settings.ini"]
ContextTitle3=Refresh now
ContextAction3=[!SetVariable RainArg force][!UpdateMeasure MeasureRainRun][!CommandMeasure MeasureRainRun "Run"][!SetVariable RainArg nowcast][!UpdateMeasure MeasureRainRun]
ContextTitle4=View: Full
ContextAction4=[!CommandMeasure MeasureSnap "SetView(0)"]
ContextTitle5=View: Simple (no chart)
ContextAction5=[!CommandMeasure MeasureSnap "SetView(1)"]
; Middle-click anywhere on the widget switches between the two views
MiddleMouseUpAction=[!CommandMeasure MeasureSnap "ViewMenu($MouseX$, $MouseY$)"]
; Fast snap checks only while the mouse is over the widget (a drag always starts there), plus a short tail after it leaves
MouseOverAction=[!CommandMeasure MeasureFastTick "Stop 2"][!CommandMeasure MeasureFastTick "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureFastTick "Stop 1"][!CommandMeasure MeasureFastTick "Execute 2"]

[Metadata]
Name=Loopscape Rain
Information=Rain or snow in the next 3 hours, in 15-minute steps.
Version=1.0
License=MIT

[Variables]
; Snapping (shared with the other widgets): margins and on/off live in @Resources\Snap.inc
@Include=#@#Snap.inc
; Shared preferences (edited by the Settings panel)
@Include2=#@#Settings.inc
; View: 0 Full (forecast and chart), 1 Simple (forecast only)
View=0
ViewNames=Full|Simple
; Set by snap.lua when stacked widgets match widths
MatchedWidth=0
UpdateMs=1000
TextFont=Space Grotesk
HeadSize=10
TitleSize=19
SubSize=12
LabelSize=9
; WeatherFetch's cache mode: nowcast (15-minute cache); "Refresh now" sends force once
RainArg=nowcast
RainInterval=900
; Chart: 12 bars of 15 minutes
BarW=15
BarGap=4
ChartH=36
; Set by rain.lua: bar heights
RH1=0
RH2=0
RH3=0
RH4=0
RH5=0
RH6=0
RH7=0
RH8=0
RH9=0
RH10=0
RH11=0
RH12=0
ColorMain=255,255,255,255
ColorSub=255,255,255,225
ColorLabel=255,255,255,150
ColorShadow=0,0,0,170
; Text pills (Settings > Text pills): shape and colour (colour is switched with the text colour)
PillColor=0,0,0,160
PillPadX=6
PillPadY=2
PillRadius=7
; Per-pill colours (set by snap.lua's adaptive colour; per-line mode can colour each pill separately)
PillFill_MeterHead=0,0,0,160
PillFill_MeterName=0,0,0,160
PillFill_MeterInfo=0,0,0,160
PillFill_MeterT0=0,0,0,160
PanelPadding=20
PanelRadius=16
SnapAttach=

; ---------------- Measures ----------------

[MeasureRainRun]
Measure=Plugin
Plugin=RunCommand
Program="#@#WeatherFetch.exe"
Parameter=#WeatherUnit# "#RainArg#" "#WeatherLocation#" "#WeatherCity#"
DynamicVariables=1
State=Hide
OutputType=UTF8
Timeout=30000
; keeps its once-a-second update so the plugin reports a finished run promptly
UpdateDivider=(1000/#UpdateMs#)
FinishAction=[!UpdateMeasure MeasureRain]

; Fires once at load, then every RainInterval seconds
[MeasureRainTimer]
Measure=Calc
Formula=1
UpdateDivider=(#RainInterval#*1000/#UpdateMs#)
OnUpdateAction=[!CommandMeasure MeasureRainRun "Run"]

; Lines the 15-minute series up with the clock and sets the text and bars; once a minute (and after each read)
[MeasureRain]
Measure=Script
ScriptFile=#CURRENTPATH#rain.lua
UpdateDivider=(60000/#UpdateMs#)

; ---------------- Meters ----------------

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(Max((Max(Max([MeterName:X]+[MeterName:W],[MeterInfo:X]+[MeterInfo:W]),(#View#=1 ? 0 : Max([MeterHead:X]+[MeterHead:W],#PanelPadding#+12*#BarW#+11*#BarGap#)))+#PanelPadding#),#MatchedWidth#)),(#View#=1 ? [MeterInfo:Y]+[MeterInfo:H]+#PanelPadding#-4 : [MeterT0:Y]+[MeterT0:H]+#PanelPadding#-6),#PanelRadius# | Fill Color 8,10,18,#PanelAlpha# | StrokeWidth 0
DynamicVariables=1

; ----- text pills: rounded backgrounds behind each text line, only when the panel tint is off -----
[Pill_MeterHead]
Meter=Shape
X=([MeterHead:X]-#PillPadX#)
Y=([MeterHead:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterHead:W]+#PillPadX#*2),([MeterHead:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterHead# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#>=1 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterName]
Meter=Shape
X=([MeterName:X]-#PillPadX#)
Y=([MeterName:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterName:W]+#PillPadX#*2),([MeterName:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterName# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterName:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterInfo]
Meter=Shape
X=([MeterInfo:X]-#PillPadX#)
Y=([MeterInfo:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterInfo:W]+#PillPadX#*2),([MeterInfo:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterInfo# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterInfo:W]<2 ? 1 : 0)))
DynamicVariables=1

; one pill behind the chart and its time labels
[Pill_MeterT0]
Meter=Shape
Group=V1
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : (#View#>=1 ? 1 : 0)))
X=(#PanelPadding#-#PillPadX#)
Y=([MeterBars:Y]-6)
Shape=Rectangle 0,0,(12*#BarW#+11*#BarGap#+#PillPadX#*2),([MeterT0:Y]+[MeterT0:H]-[MeterBars:Y]+8),#PillRadius# | Fill Color #PillFill_MeterT0# | StrokeWidth 0
DynamicVariables=1

[StyleText]
FontFace=#TextFont#
AntiAlias=1
StringEffect=#TextEffect#
FontEffectColor=#ColorShadow#
FontColor=#ColorSub#
FontWeight=500
DynamicVariables=1

[MeterHead]
Meter=String
Group=V1
Hidden=(#View#>=1)
MeterStyle=StyleText
Text=RAIN
X=#PanelPadding#
Y=(#PanelPadding#-2)
FontSize=#HeadSize#
FontWeight=600
FontColor=#ColorLabel#

[MeterName]
Meter=String
MeterStyle=StyleText
Text=...
X=#PanelPadding#
Y=(#View#=1 ? #PanelPadding# : #PanelPadding#+13)
FontSize=#TitleSize#
FontColor=#ColorMain#

[MeterInfo]
Meter=String
MeterStyle=StyleText
Text=
X=#PanelPadding#
Y=(#View#=1 ? #PanelPadding#+29 : #PanelPadding#+42)
FontSize=#SubSize#

; Bars: rain in each 15 minutes (heights RH1..RH12 set by rain.lua; 0 when dry, leaving the dotted baseline)
[MeterBars]
Meter=Shape
Group=V1
Hidden=(#View#>=1)
X=#PanelPadding#
Y=([MeterInfo:Y]+[MeterInfo:H]+10)
Shape=Line 0,(#ChartH#-0.5),(12*#BarW#+11*#BarGap#),(#ChartH#-0.5) | StrokeWidth 1 | Stroke Color #ColorLabel# | StrokeDashes 1,3
Shape2=Rectangle (0*(#BarW#+#BarGap#)),(#ChartH#-#RH1#),#BarW#,#RH1#,(#RH1#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape3=Rectangle (1*(#BarW#+#BarGap#)),(#ChartH#-#RH2#),#BarW#,#RH2#,(#RH2#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape4=Rectangle (2*(#BarW#+#BarGap#)),(#ChartH#-#RH3#),#BarW#,#RH3#,(#RH3#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape5=Rectangle (3*(#BarW#+#BarGap#)),(#ChartH#-#RH4#),#BarW#,#RH4#,(#RH4#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape6=Rectangle (4*(#BarW#+#BarGap#)),(#ChartH#-#RH5#),#BarW#,#RH5#,(#RH5#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape7=Rectangle (5*(#BarW#+#BarGap#)),(#ChartH#-#RH6#),#BarW#,#RH6#,(#RH6#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape8=Rectangle (6*(#BarW#+#BarGap#)),(#ChartH#-#RH7#),#BarW#,#RH7#,(#RH7#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape9=Rectangle (7*(#BarW#+#BarGap#)),(#ChartH#-#RH8#),#BarW#,#RH8#,(#RH8#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape10=Rectangle (8*(#BarW#+#BarGap#)),(#ChartH#-#RH9#),#BarW#,#RH9#,(#RH9#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape11=Rectangle (9*(#BarW#+#BarGap#)),(#ChartH#-#RH10#),#BarW#,#RH10#,(#RH10#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape12=Rectangle (10*(#BarW#+#BarGap#)),(#ChartH#-#RH11#),#BarW#,#RH11#,(#RH11#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
Shape13=Rectangle (11*(#BarW#+#BarGap#)),(#ChartH#-#RH12#),#BarW#,#RH12#,(#RH12#>4 ? 2 : 0) | Fill Color #ColorMain# | StrokeWidth 0
DynamicVariables=1

[StyleTime]
Group=V1
Hidden=(#View#>=1)
FontSize=#LabelSize#
FontColor=#ColorLabel#
Y=([MeterBars:Y]+#ChartH#+4)

[MeterT0]
Meter=String
MeterStyle=StyleText | StyleTime
Text=now
X=#PanelPadding#

[MeterT1]
Meter=String
MeterStyle=StyleText | StyleTime
Text=+1h
StringAlign=Center
X=(#PanelPadding#+4*(#BarW#+#BarGap#)-#BarGap#/2)

[MeterT2]
Meter=String
MeterStyle=StyleText | StyleTime
Text=+2h
StringAlign=Center
X=(#PanelPadding#+8*(#BarW#+#BarGap#)-#BarGap#/2)

[MeterT3]
Meter=String
MeterStyle=StyleText | StyleTime
Text=+3h
StringAlign=Right
X=(#PanelPadding#+12*#BarW#+11*#BarGap#)

; Natural content width, read by snap.lua to match stacked widths
[MeasureNaturalWidth]
Measure=Calc
UpdateDivider=(1000/#UpdateMs#)
Formula=(Max(Max([MeterName:X]+[MeterName:W],[MeterInfo:X]+[MeterInfo:W]),(#View#=1 ? 0 : Max([MeterHead:X]+[MeterHead:W],#PanelPadding#+12*#BarW#+11*#BarGap#)))+#PanelPadding#)
DynamicVariables=1

; Runs snap.lua every 100 ms while the mouse is over the widget (2 min max), and for 2 s after it leaves.
; snap.lua also starts list 3 (50 ms) for the wallpaper fade, list 4 (33 ms, 2 min max) while the widget is
; being dragged, and list 5 (16 ms, 1 s max) while it glides into its spot after a drop.
[MeasureFastTick]
Measure=Plugin
Plugin=ActionTimer
UpdateDivider=(1000/#UpdateMs#)
ActionList1=Repeat Tick, 100, 1200
ActionList2=Repeat Tick, 100, 20
ActionList3=Repeat Tick, 50, 200
ActionList4=Repeat Tick, 33, 3600
ActionList5=Repeat Tick, 16, 60
Tick=[!UpdateMeasure MeasureSnap]
DynamicVariables=1
