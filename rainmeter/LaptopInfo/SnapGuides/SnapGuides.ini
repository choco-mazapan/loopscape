; Snap guides for the LaptopInfo widgets: dashed outlines of where the dragged widget can snap (free screen
; spots and stack spots above/below other widgets). snap.lua positions them, shows this skin while dragging,
; and tints the target. Click-through and hidden the rest of the time.

[Rainmeter]
Update=-1
DynamicWindowSize=1
OnRefreshAction=[!Hide][!Move #SCREENAREAX# #SCREENAREAY#][!Draggable 0][!ClickThrough 1][!ZPos 1]

[Metadata]
Name=LaptopInfo Snap Guides
Information=Shows where a LaptopInfo widget can snap while you drag it.
License=MIT

[Variables]
W=376
H=245
Radius=16
GX1=0
GY1=0
GH1=1
Fill1=0,0,0,0
Stroke1=255,255,255,110
Width1=1.5
