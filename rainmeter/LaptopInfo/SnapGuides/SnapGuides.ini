; Invisible full-screen backdrop so the window spans the whole screen
[MeterBackdrop]
Meter=Image
W=#SCREENAREAWIDTH#
H=#SCREENAREAHEIGHT#
SolidColor=0,0,0,1

[Guide1]
Meter=Shape
X=#GX1#
Y=#GY1#
Hidden=#GH1#
Shape=Rectangle 1,1,(#W#-2),(#H#-2),#Radius# | Fill Color #Fill1# | StrokeWidth #Width1# | Stroke Color #Stroke1# | StrokeDashes 3,2.5
Shape2=Rectangle 2,2,(#W#-2),(#H#-2),#Radius# | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 0,0,0,150 | StrokeDashes 3,2.5
DynamicVariables=1

