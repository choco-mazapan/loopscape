; LaptopInfo - clock, battery and weather widget for Rainmeter
; Fonts (in @Resources\Fonts, loaded automatically): Geist Pixel Circle (clock), Space Grotesk (text) - both SIL OFL.
; Weather: @Resources\WeatherFetch.exe (a typed city or Windows location + Open-Meteo), refreshed at most once an hour.

[Rainmeter]
; Ticks once a second. While the mouse is over the widget, MeasureFastTick runs the snap logic every 100 ms
; so dragging and dropping still feel instant (see MouseOverAction below).
Update=#UpdateMs#
DefaultUpdateDivider=(1000/#UpdateMs#)
AccurateText=1
; Snapping keeps the widget on screen; Rainmeter's own nudging would look like a drag
OnRefreshAction=[!KeepOnScreen 0]
DynamicWindowSize=1
; Right-click > Edit variables opens this file
ContextTitle=Edit variables
ContextAction=["#CONFIGEDITOR#" "#CURRENTPATH#Clock.ini"]
ContextTitle2=Refresh weather now
ContextAction2=[!SetVariable WeatherForce force][!UpdateMeasure MeasureWeatherRun][!CommandMeasure MeasureWeatherRun "Run"][!SetVariable WeatherForce ""][!UpdateMeasure MeasureWeatherRun]
ContextTitle3=Settings...
ContextAction3=[!ActivateConfig "LaptopInfo\Settings" "Settings.ini"]
ContextTitle4=Next wallpaper (Win+Alt+N)
ContextAction4=[!CommandMeasure MeasureSnap "NextWallpaper()"]
ContextTitle5=View: Full
ContextAction5=[!CommandMeasure MeasureSnap "SetView(0)"]
ContextTitle6=View: Simple (time, weather, date, battery)
ContextAction6=[!CommandMeasure MeasureSnap "SetView(1)"]
ContextTitle7=View: Compact (time, date, battery)
ContextAction7=[!CommandMeasure MeasureSnap "SetView(2)"]
ContextTitle8=View: Time only
ContextAction8=[!CommandMeasure MeasureSnap "SetView(3)"]
ContextTitle9=Clock: switch 12-hour / 24-hour
ContextAction9=[!WriteKeyValue Variables ClockFormat (36-#ClockFormat#) "#@#Settings.inc"][!Refresh]
; Middle-click anywhere on the widget opens a small menu of views (or cycles when there are only two)
MiddleMouseUpAction=[!CommandMeasure MeasureSnap "ViewMenu($MouseX$, $MouseY$)"]
; Fast snap checks only while the mouse is over the widget (a drag always starts there), plus a short tail after it leaves
MouseOverAction=[!CommandMeasure MeasureFastTick "Stop 2"][!CommandMeasure MeasureFastTick "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureFastTick "Stop 1"][!CommandMeasure MeasureFastTick "Execute 2"]

[Metadata]
Name=LaptopInfo Clock
Information=24-hour clock, date, battery percentage, estimated time left and current weather.
Version=2.0
License=MIT

[Variables]
; Snapping (shared with the Wi-Fi widget): margins and on/off live in @Resources\Snap.inc
@Include=#@#Snap.inc
; Defaults for settings that older Settings.inc files don't have yet (Settings.inc, included next, overrides them)
WeatherLocation=city
WeatherCity=
; Shared preferences (edited by the Settings panel)
@Include2=#@#Settings.inc
; View: 0 Full, 1 Simple (time, weather, date, battery), 2 Compact (time, date, battery), 3 Time only.
; Middle-click the widget for a menu of views, or use the right-click menu.
View=0
ViewNames=Full|Simple|Compact|Time only
; Set by snap.lua when stacked widgets match widths
MatchedWidth=0
; Set by snap.lua from the widget's screen column: 0 left, 1 centre, 2 right
ColumnAlign=0
UpdateMs=1000
ClockFont=Geist Pixel Circle
TextFont=Space Grotesk
ClockSize=66
DateSize=16
BatterySize=16
WeatherTempSize=24
WeatherDescSize=12
WeatherIconSize=48
ColorMain=255,255,255,255
ColorSub=255,255,255,225
ColorWarn=255,140,120,255
ColorShadow=0,0,0,170
; Icon colour (switched together with the text colour by snap.lua's SetTheme)
IconTint=255,255,255,255
; Weather icon colour set per icon, light (dark background) or deep (light background); snap.lua switches them
WxShade_MeterWeatherIcon=light
WxShade_MeterFcIcon1=light
WxShade_MeterFcIcon2=light
WxShade_MeterFcIcon3=light
; Text pills (Settings > Text pills): shape and colour (colour is switched with the text colour)
PillColor=0,0,0,160
PillPadX=6
PillPadY=2
PillRadius=7
; Per-pill colours (set by snap.lua's adaptive colour; per-line mode can colour each pill separately)
PillFill_MeterAmPm=0,0,0,160
PillFill_MeterWeatherTemp=0,0,0,160
PillFill_MeterWeatherDesc=0,0,0,160
PillFill_MeterWeatherCity=0,0,0,160
PillFill_MeterDate=0,0,0,160
PillFill_MeterBattery=0,0,0,160
PillFill_MeterFcDay1=0,0,0,160
PillFill_MeterFcTemp1=0,0,0,160
PillFill_MeterFcDay2=0,0,0,160
PillFill_MeterFcTemp2=0,0,0,160
PillFill_MeterFcDay3=0,0,0,160
PillFill_MeterFcTemp3=0,0,0,160
ColorCity=255,255,255,170
; Backdrop panel behind the text (alpha 0 = no panel)
; Panel colour: 8,10,18 with the darkness (alpha) from Settings.inc
PanelPadding=20
PanelRadius=16
; Battery % at or below which the line turns ColorWarn (on battery only)
LowBattery=20
; Seconds between battery refreshes (the clock still updates every second)
BatteryInterval=5
; Seconds between weather refreshes (unit is in Settings.inc). WeatherFetch also caches for an hour on its own.
WeatherInterval=3600
WeatherForce=
; 3-day forecast row: column width, icon size, text size
ForecastColumn=112
ForecastIconSize=32
ForecastTextSize=13
SnapAttach=

; ---------------- Measures ----------------

; Time in both formats; MeterTime shows MeasureTime#ClockFormat# (ClockFormat is 24 or 12, from Settings.inc)
[MeasureTime24]
Measure=Time
Format=%H:%M

[MeasureTime12]
Measure=Time
Format=%#I:%M

[MeasureAmPm]
Measure=Time
Format=%p

[MeasureDate]
Measure=Time
Format=%A, %#d %B

[MeasureACLine]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)

[MeasureStatus]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)

[MeasurePercent]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)

[MeasureLifetime]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Lifetime
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)

[MeasureBatteryText]
Measure=Script
ScriptFile=#CURRENTPATH#battery.lua
UpdateDivider=(#BatteryInterval#*1000/#UpdateMs#)

; Runs the weather helper hidden; its output is parsed by weather.lua. The helper fetches location + weather at most
; once an hour and otherwise prints its cached result, so running it often is cheap. WeatherForce=force (set
; briefly by "Refresh weather now") skips the cache.
[MeasureWeatherRun]
Measure=Plugin
Plugin=RunCommand
Program="#@#WeatherFetch.exe"
Parameter=#WeatherUnit# "#WeatherForce#" "#WeatherLocation#" "#WeatherCity#"
DynamicVariables=1
State=Hide
OutputType=UTF8
Timeout=30000
FinishAction=[!UpdateMeasure MeasureWeather]

; Fires once at load, then every WeatherInterval seconds
[MeasureWeatherTimer]
Measure=Calc
Formula=1
UpdateDivider=(#WeatherInterval#*1000/#UpdateMs#)
OnUpdateAction=[!CommandMeasure MeasureWeatherRun "Run"]

[MeasureWeather]
Measure=Script
ScriptFile=#CURRENTPATH#weather.lua
UpdateDivider=-1

[MeasureWeatherTemp]
Measure=String
String=--
UpdateDivider=-1

; ---------------- Meters ----------------

; Translucent rounded panel sized to the content, so it stays readable on bright or busy wallpapers
[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(Max((Max(Max(#PanelPadding#+([MeterTime:W]+(#ClockFormat#=12 ? [MeterAmPm:W]+6 : 0)),Max((#View#>=2 ? 0 : [MeterWeatherTemp:X]+[MeterWeatherTemp:W]),(#View#>=1 ? 0 : Max([MeterWeatherDesc:X]+[MeterWeatherDesc:W],[MeterWeatherCity:X]+[MeterWeatherCity:W])))),Max((#View#>=3 ? 0 : Max([MeterDate:X]+[MeterDate:W],[MeterBattery:X]+[MeterBattery:W])),(#View#>=1 ? 0 : #PanelPadding#+3*#ForecastColumn#)))+#PanelPadding#),#MatchedWidth#)),(#View#>=3 ? [MeterTime:Y]+[MeterTime:H]+#PanelPadding#-12 : (#View#>=1 ? [MeterBattery:Y]+[MeterBattery:H]+#PanelPadding#-4 : [MeterFcTemp1:Y]+[MeterFcTemp1:H]+#PanelPadding#-4)),#PanelRadius# | Fill Color 8,10,18,#PanelAlpha# | StrokeWidth 0
DynamicVariables=1

; ----- invisible copies of fast-changing text, updated before the pills so each pill matches its text
; in the same update (pills read [Ghost_*:W]; position doesn't matter, only the width) -----
[Ghost_MeterBattery]
Meter=String
Hidden=(#View#>=3)
MeterStyle=StyleText
MeasureName=MeasureBatteryText
FontSize=#BatterySize#
FontWeight=500
DynamicVariables=1
X=0
Y=0
FontColor=0,0,0,0
StringEffect=None

; ----- text pills: rounded backgrounds behind each text line, only when the panel tint is off -----
; (placed before all text so they're drawn behind it; hidden when their text is hidden or empty)
[Pill_MeterAmPm]
Meter=Shape
X=([MeterAmPm:X]-#PillPadX#)
Y=([MeterAmPm:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterAmPm:W]+#PillPadX#*2),([MeterAmPm:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterAmPm# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterAmPm:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterWeatherTemp]
Meter=Shape
X=([MeterWeatherTemp:X]-#PillPadX#)
Y=([MeterWeatherTemp:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterWeatherTemp:W]+#PillPadX#*2),([MeterWeatherTemp:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterWeatherTemp# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterWeatherTemp:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterWeatherDesc]
Meter=Shape
X=([MeterWeatherDesc:X]-#PillPadX#)
Y=([MeterWeatherDesc:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterWeatherDesc:W]+#PillPadX#*2),([MeterWeatherDesc:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterWeatherDesc# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterWeatherDesc:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterWeatherCity]
Meter=Shape
X=([MeterWeatherCity:X]-#PillPadX#)
Y=([MeterWeatherCity:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterWeatherCity:W]+#PillPadX#*2),([MeterWeatherCity:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterWeatherCity# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterWeatherCity:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterDate]
Meter=Shape
X=([MeterDate:X]-#PillPadX#)
Y=([MeterDate:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterDate:W]+#PillPadX#*2),([MeterDate:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterDate# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterDate:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterBattery]
Meter=Shape
X=([MeterBattery:X]-#PillPadX#)
Y=([MeterBattery:Y]+#PillPadY#)
Shape=Rectangle 0,0,([Ghost_MeterBattery:W]+#PillPadX#*2),([Ghost_MeterBattery:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterBattery# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([Ghost_MeterBattery:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterFcDay1]
Meter=Shape
X=([MeterFcDay1:X]-#PillPadX#)
Y=([MeterFcDay1:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterFcDay1:W]+#PillPadX#*2),([MeterFcDay1:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterFcDay1# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterFcDay1:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterFcTemp1]
Meter=Shape
X=([MeterFcTemp1:X]-#PillPadX#)
Y=([MeterFcTemp1:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterFcTemp1:W]+#PillPadX#*2),([MeterFcTemp1:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterFcTemp1# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterFcTemp1:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterFcDay2]
Meter=Shape
X=([MeterFcDay2:X]-#PillPadX#)
Y=([MeterFcDay2:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterFcDay2:W]+#PillPadX#*2),([MeterFcDay2:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterFcDay2# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterFcDay2:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterFcTemp2]
Meter=Shape
X=([MeterFcTemp2:X]-#PillPadX#)
Y=([MeterFcTemp2:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterFcTemp2:W]+#PillPadX#*2),([MeterFcTemp2:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterFcTemp2# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterFcTemp2:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterFcDay3]
Meter=Shape
X=([MeterFcDay3:X]-#PillPadX#)
Y=([MeterFcDay3:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterFcDay3:W]+#PillPadX#*2),([MeterFcDay3:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterFcDay3# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterFcDay3:W]<2 ? 1 : 0)))
DynamicVariables=1

[Pill_MeterFcTemp3]
Meter=Shape
X=([MeterFcTemp3:X]-#PillPadX#)
Y=([MeterFcTemp3:Y]+#PillPadY#)
Shape=Rectangle 0,0,([MeterFcTemp3:W]+#PillPadX#*2),([MeterFcTemp3:H]-#PillPadY#*2),#PillRadius# | Fill Color #PillFill_MeterFcTemp3# | StrokeWidth 0
Hidden=(#PanelAlpha#>0 ? 1 : (#TextPills#=0 ? 1 : ([MeterFcTemp3:W]<2 ? 1 : 0)))
DynamicVariables=1

; Thin divider between battery and forecast (hidden in simple view)
[MeterDivider]
Meter=Shape
Group=V1
Hidden=(#View#>=1)
Shape=Line #PanelPadding#,([MeterBattery:Y]+[MeterBattery:H]+10),([MeterPanel:W]-#PanelPadding#),([MeterBattery:Y]+[MeterBattery:H]+10) | StrokeWidth 1 | Stroke Color 255,255,255,45
DynamicVariables=1

[StyleText]
FontFace=#TextFont#
AntiAlias=1
StringEffect=#TextEffect#
FontEffectColor=#ColorShadow#
FontColor=#ColorSub#
DynamicVariables=1

[MeterTime]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureTime#ClockFormat#
FontFace=#ClockFont#
; Time-only view: centre the time in the (possibly width-matched) panel in the centre column, right-align it in the right column
X=(#View#=3 ? (#ColumnAlign#=1 ? Trunc(([MeterPanel:W]-([MeterTime:W]+(#ClockFormat#=12 ? [MeterAmPm:W]+6 : 0)))/2) : (#ColumnAlign#=2 ? [MeterPanel:W]-([MeterTime:W]+(#ClockFormat#=12 ? [MeterAmPm:W]+6 : 0))-#PanelPadding# : #PanelPadding#)) : #PanelPadding#)
Y=(#PanelPadding#-6)
FontSize=#ClockSize#
FontColor=#ColorMain#
; re-evaluate X when the view or column changes
DynamicVariables=1

; AM/PM next to the time in 12-hour mode
[MeterAmPm]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureAmPm
Hidden=(#ClockFormat#=24)
X=([MeterTime:X]+[MeterTime:W]+6)
Y=([MeterTime:Y]+24)
FontSize=15
FontWeight=500
FontColor=#ColorMain#
DynamicVariables=1

; ----- weather column, to the right of the clock -----
[MeterWeatherIcon]
Meter=Image
; tinted dark with the text when the background is light
ImageTint=#IconTint#
X=([MeterTime:X]+([MeterTime:W]+(#ClockFormat#=12 ? [MeterAmPm:W]+6 : 0))+24)
Group=Weather | Tips | V2
Hidden=(#View#>=2)
Y=([MeterTime:Y]+([MeterTime:H]-#WeatherIconSize#)/2-10)
W=#WeatherIconSize#
H=#WeatherIconSize#
PreserveAspectRatio=1
DynamicVariables=1

[MeterWeatherTemp]
Meter=String
MeterStyle=StyleText
Group=Weather | Tips | V2
Hidden=(#View#>=2)
MeasureName=MeasureWeatherTemp
Text=%1[\x00B0]
X=10R
Y=([MeterWeatherIcon:Y]+2)
FontSize=#WeatherTempSize#
FontWeight=500
FontColor=#ColorMain#
DynamicVariables=1

[MeterWeatherDesc]
Meter=String
MeterStyle=StyleText
Group=Weather | Tips | V1
Hidden=(#View#>=1)
Text=
X=([MeterWeatherIcon:X]+2)
Y=([MeterWeatherIcon:Y]+#WeatherIconSize#+6)
FontSize=#WeatherDescSize#
FontWeight=500
DynamicVariables=1

[MeterWeatherCity]
Meter=String
MeterStyle=StyleText
Group=Weather | Tips | V1
Hidden=(#View#>=1)
Text=
X=([MeterWeatherIcon:X]+2)
Y=([MeterWeatherDesc:Y]+[MeterWeatherDesc:H]+1)
FontSize=#WeatherDescSize#
FontWeight=400
FontColor=#ColorCity#
DynamicVariables=1

; ----- date and battery, under the clock -----
[MeterDate]
Meter=String
Group=V3
Hidden=(#View#>=3)
MeterStyle=StyleText
MeasureName=MeasureDate
X=(#PanelPadding#+4)
Y=([MeterTime:Y]+[MeterTime:H]-4)
FontSize=#DateSize#
FontWeight=500
DynamicVariables=1

[MeterBattery]
Meter=String
Group=V3
Hidden=(#View#>=3)
MeterStyle=StyleText
MeasureName=MeasureBatteryText
X=(#PanelPadding#+4)
Y=4R
FontSize=#BatterySize#
FontWeight=500
DynamicVariables=1

; ----- 3-day forecast row, under the battery line -----
[MeterFcIcon1]
Meter=Image
; tinted dark with the text when the background is light
ImageTint=#IconTint#
Group=Forecast | Tips | V1
Hidden=(#View#>=1)
X=(#PanelPadding#+0*#ForecastColumn#)
Y=([MeterBattery:Y]+[MeterBattery:H]+22)
W=#ForecastIconSize#
H=#ForecastIconSize#
DynamicVariables=1

[MeterFcDay1]
Meter=String
MeterStyle=StyleText
Group=Forecast | Tips | V1
Hidden=(#View#>=1)
Text=
X=([MeterFcIcon1:X]+#ForecastIconSize#+7)
Y=([MeterFcIcon1:Y]-3)
FontSize=#ForecastTextSize#
FontWeight=500
DynamicVariables=1

[MeterFcTemp1]
Meter=String
MeterStyle=StyleText
Group=Forecast | Tips | V1
Hidden=(#View#>=1)
Text=
X=([MeterFcIcon1:X]+#ForecastIconSize#+7)
Y=([MeterFcIcon1:Y]+15)
FontSize=#ForecastTextSize#
FontWeight=500
FontColor=#ColorMain#
DynamicVariables=1

[MeterFcIcon2]
Meter=Image
; tinted dark with the text when the background is light
ImageTint=#IconTint#
Group=Forecast | Tips | V1
Hidden=(#View#>=1)
X=(#PanelPadding#+1*#ForecastColumn#)
Y=([MeterBattery:Y]+[MeterBattery:H]+22)
W=#ForecastIconSize#
H=#ForecastIconSize#
DynamicVariables=1

[MeterFcDay2]
Meter=String
MeterStyle=StyleText
Group=Forecast | Tips | V1
Hidden=(#View#>=1)
Text=
X=([MeterFcIcon2:X]+#ForecastIconSize#+7)
Y=([MeterFcIcon2:Y]-3)
FontSize=#ForecastTextSize#
FontWeight=500
DynamicVariables=1

[MeterFcTemp2]
Meter=String
MeterStyle=StyleText
Group=Forecast | Tips | V1
Hidden=(#View#>=1)
Text=
X=([MeterFcIcon2:X]+#ForecastIconSize#+7)
Y=([MeterFcIcon2:Y]+15)
FontSize=#ForecastTextSize#
FontWeight=500
FontColor=#ColorMain#
DynamicVariables=1

[MeterFcIcon3]
Meter=Image
; tinted dark with the text when the background is light
ImageTint=#IconTint#
Group=Forecast | Tips | V1
Hidden=(#View#>=1)
X=(#PanelPadding#+2*#ForecastColumn#)
Y=([MeterBattery:Y]+[MeterBattery:H]+22)
W=#ForecastIconSize#
H=#ForecastIconSize#
DynamicVariables=1

[MeterFcDay3]
Meter=String
MeterStyle=StyleText
Group=Forecast | Tips | V1
Hidden=(#View#>=1)
Text=
X=([MeterFcIcon3:X]+#ForecastIconSize#+7)
Y=([MeterFcIcon3:Y]-3)
FontSize=#ForecastTextSize#
FontWeight=500
DynamicVariables=1

[MeterFcTemp3]
Meter=String
MeterStyle=StyleText
Group=Forecast | Tips | V1
Hidden=(#View#>=1)
Text=
X=([MeterFcIcon3:X]+#ForecastIconSize#+7)
Y=([MeterFcIcon3:Y]+15)
FontSize=#ForecastTextSize#
FontWeight=500
FontColor=#ColorMain#
DynamicVariables=1

; Natural content width, read by snap.lua to match stacked widths
[MeasureNaturalWidth]
Measure=Calc
Formula=(Max(Max(#PanelPadding#+([MeterTime:W]+(#ClockFormat#=12 ? [MeterAmPm:W]+6 : 0)),Max((#View#>=2 ? 0 : [MeterWeatherTemp:X]+[MeterWeatherTemp:W]),(#View#>=1 ? 0 : Max([MeterWeatherDesc:X]+[MeterWeatherDesc:W],[MeterWeatherCity:X]+[MeterWeatherCity:W])))),Max((#View#>=3 ? 0 : Max([MeterDate:X]+[MeterDate:W],[MeterBattery:X]+[MeterBattery:W])),(#View#>=1 ? 0 : #PanelPadding#+3*#ForecastColumn#)))+#PanelPadding#)
DynamicVariables=1

; Runs snap.lua every 100 ms while the mouse is over the widget (2 min max), and for 2 s after it leaves
[MeasureFastTick]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Tick, 100, 1200
ActionList2=Repeat Tick, 100, 20
ActionList3=Repeat Tick, 50, 200
Tick=[!UpdateMeasure MeasureSnap]
DynamicVariables=1
