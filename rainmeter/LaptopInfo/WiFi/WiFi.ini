; Natural content width, read by snap.lua to match stacked widths

[MeasureNaturalWidth]
Measure=Calc
Formula=(Max(Max([MeterSSID:X]+[MeterSSID:W],[MeterQuality:X]+[MeterQuality:W]),(#View#=1 ? 0 : Max(Max([MeterV1:X]+[MeterV1:W],[MeterV2:X]+[MeterV2:W]),Max([MeterV3:X]+[MeterV3:W],Max([MeterTrafficUp:X]+[Tpl_Speed:W],(#View#=0 ? #PanelPadding#+260 : 0))))))+#PanelPadding#)
DynamicVariables=1

; Runs snap.lua every 100 ms while the mouse is over the widget (2 min max), and for 2 s after it leaves
[MeasureFastTick]
