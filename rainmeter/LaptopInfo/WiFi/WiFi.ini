Hidden=(#View#=1)
MeterStyle=StyleText | StyleValue
Text=#PingSample#
DynamicVariables=1
X=0
Y=0
FontColor=0,0,0,0
StringEffect=None

[Tpl_Speed]
Meter=String
Hidden=(#View#=1)
MeterStyle=StyleText
Text=[\x2193] #SpeedSample#
FontSize=#ValueSize#
DynamicVariables=1
X=0
Y=0
FontColor=0,0,0,0
StringEffect=None

; ----- invisible copies of fast-changing text, updated before the pills so each pill matches its text
; in the same update (pills read [Ghost_*:W]; position doesn't matter, only the width) -----
[Ghost_MeterV7]
