; LaptopInfo - Wi-Fi widget for Rainmeter: network name, signal, band/channel, link speed, standard, security,
; signal strength, local IP, ping and live download/upload speed.
; Wi-Fi details come from @Resources\WifiInfo.exe (netsh-style output, parsed by wifi.lua) once a minute, and only
; in the views that show them.

[Rainmeter]
; Ticks once a second. While the mouse is over the widget, MeasureFastTick runs the snap logic every 100 ms
; so dragging and dropping still feel instant (see MouseOverAction below).
Update=#UpdateMs#
DefaultUpdateDivider=(1000/#UpdateMs#)
AccurateText=1
; Snapping keeps the widget on screen; Rainmeter's own nudging would look like a drag
OnRefreshAction=[!KeepOnScreen 0]
DynamicWindowSize=1
ContextTitle=Edit variables
ContextAction=["#CONFIGEDITOR#" "#CURRENTPATH#WiFi.ini"]
ContextTitle2=Refresh Wi-Fi details now
ContextAction2=[!CommandMeasure MeasureNetsh "Run"]
ContextTitle3=Settings...
ContextAction3=[!ActivateConfig "LaptopInfo\Settings" "Settings.ini"]
ContextTitle4=Next wallpaper (Win+Alt+N)
ContextAction4=[!CommandMeasure MeasureSnap "NextWallpaper()"]
ContextTitle5=View: Full
ContextAction5=[!CommandMeasure MeasureSnap "SetView(0)"]
ContextTitle6=View: Simple (name and signal)
ContextAction6=[!CommandMeasure MeasureSnap "SetView(1)"]
ContextTitle7=View: Network (ping and speeds)
ContextAction7=[!CommandMeasure MeasureSnap "SetView(2)"]
; Middle-click anywhere on the widget opens a small menu of views
MiddleMouseUpAction=[!CommandMeasure MeasureSnap "ViewMenu($MouseX$, $MouseY$)"]
; Fast snap checks only while the mouse is over the widget (a drag always starts there), plus a short tail after it leaves
MouseOverAction=[!CommandMeasure MeasureFastTick "Stop 2"][!CommandMeasure MeasureFastTick "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureFastTick "Stop 1"][!CommandMeasure MeasureFastTick "Execute 2"]

[Metadata]
Name=LaptopInfo Wi-Fi
Information=Current Wi-Fi connection details, matching the LaptopInfo clock widget.
Version=1.0
License=MIT

[Variables]
; Snapping (shared with the clock widget): margins and on/off live in @Resources\Snap.inc
@Include=#@#Snap.inc
; Shared preferences (edited by the Settings panel)
@Include2=#@#Settings.inc
; View: 0 Full, 1 Simple (name and signal), 2 Network (ping and down/up speed only).
; Middle-click the widget for a menu of views, or use the right-click menu.
View=2
ViewNames=Full|Simple|Network
; Set by snap.lua when stacked widgets match widths
MatchedWidth=0
UpdateMs=1000
TextFont=Space Grotesk
TitleSize=19
SubSize=13
LabelSize=12
ValueSize=13
LabelWidth=92
RowHeight=21
; Ping and speed columns are as wide as typical worst-case text in the real font (Tpl_* meters below), so the widget
; doesn't change size as the numbers change but has no dead space either; ColGap is the space between columns
; (the text itself is not fixed-width, so text pills hug each value)
PingSample=888 ms
SpeedSample=888.8 kB/s
ColGap=20
ColorMain=255,255,255,255
ColorSub=255,255,255,225
ColorLabel=255,255,255,150
ColorShadow=0,0,0,170
; Icon colour (switched together with the text colour by snap.lua's SetTheme)
IconTint=255,255,255,255
; Text pills (Settings > Text pills): shape and colour (colour is switched with the text colour)
PillColor=0,0,0,160
PillPadX=6
PillPadY=2
PillRadius=7
; Per-pill colours (set by snap.lua's adaptive colour; per-line mode can colour each pill separately)
PillFill_MeterSSID=0,0,0,160
PillFill_MeterQuality=0,0,0,160
PillFill_MeterL1=0,0,0,160
PillFill_MeterV1=0,0,0,160
PillFill_MeterL2=0,0,0,160
PillFill_MeterV2=0,0,0,160
PillFill_MeterL3=0,0,0,160
PillFill_MeterV3=0,0,0,160
PillFill_MeterL4=0,0,0,160
PillFill_MeterV4=0,0,0,160
PillFill_MeterL5=0,0,0,160
PillFill_MeterV5=0,0,0,160
PillFill_MeterL6=0,0,0,160
PillFill_MeterV6=0,0,0,160
PillFill_MeterL7=0,0,0,160
PillFill_MeterV7=0,0,0,160
PillFill_MeterTraffic=0,0,0,160
PillFill_MeterTrafficUp=0,0,0,160
; Panel colour: 8,10,18 with the darkness (alpha) from Settings.inc
PanelPadding=20
PanelRadius=16
; Seconds between Wi-Fi detail refreshes (only in the Full and Simple views; see MeasureNetshTimer)
WifiInterval=60
; Host to ping for latency, and seconds between pings
PingHost=1.1.1.1
PingInterval=15
SnapAttach=LaptopInfo\Clock|below

; ---------------- Measures ----------------

; Runs @Resources\WifiInfo.exe hidden: prints the same lines as "netsh wlan show interfaces" (UTF-8), but shows up as
; "Loopscape" in Windows' location settings (reading Wi-Fi names counts as location access)
[MeasureNetsh]
Measure=Plugin
Plugin=RunCommand
Program="#@#WifiInfo.exe"
Parameter=
State=Hide
OutputType=UTF8
Timeout=10000
FinishAction=[!UpdateMeasure MeasureWifi]

; Reads the Wi-Fi details every WifiInterval seconds, but only in the views that show them (Full, Simple): Windows
; counts reading the network name as location access, and the Network view (ping and speeds) doesn't need it.
; snap.lua's SetView updates this measure on a view change, so switching back to Full/Simple reads them right away.
[MeasureNetshTimer]
Measure=Calc
Formula=#View#
DynamicVariables=1
UpdateDivider=(#WifiInterval#*1000/#UpdateMs#)
IfCondition=MeasureNetshTimer<2
IfTrueAction=[!CommandMeasure MeasureNetsh "Run"]
IfConditionMode=1

[MeasureWifi]
Measure=Script
ScriptFile=#CURRENTPATH#wifi.lua
UpdateDivider=-1

[MeasureIP]
Measure=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
; IP only changes on reconnect: look it up every 15 s instead of every second
UpdateDivider=15
; No address while disconnected: show a dash
RegExpSubstitute=1
Substitute="^$":"-","^0\.0\.0\.0$":"-","^127\.0\.0\.1$":"-"

[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#PingHost#
UpdateRate=#PingInterval#
Timeout=3000
; No reply (offline / timed out) returns -1; show a plain dash instead of a number then
TimeoutValue=-1
IfCondition=MeasurePing <= 0
IfTrueAction=[!SetOption MeterV7 Text "-"][!SetOption Ghost_MeterV7 Text "-"][!UpdateMeter Ghost_MeterV7][!UpdateMeter MeterV7][!Redraw]
IfFalseAction=[!SetOption MeterV7 Text "%1 ms"][!SetOption Ghost_MeterV7 Text "%1 ms"][!UpdateMeter Ghost_MeterV7][!UpdateMeter MeterV7][!Redraw]

[MeasureDown]
Measure=NetIn
Interface=Best

[MeasureUp]
Measure=NetOut
Interface=Best

; ---------------- Meters ----------------

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,(Max((Max(Max([MeterSSID:X]+[MeterSSID:W],[MeterQuality:X]+[MeterQuality:W]),(#View#=1 ? 0 : Max(Max([MeterV1:X]+[MeterV1:W],[MeterV2:X]+[MeterV2:W]),Max([MeterV3:X]+[MeterV3:W],Max([MeterTrafficUp:X]+[Tpl_Speed:W],(#View#=0 ? #PanelPadding#+260 : 0))))))+#PanelPadding#),#MatchedWidth#)),(#View#=1 ? #PanelPadding#*2+48 : [MeterTraffic:Y]+[MeterTraffic:H]+#PanelPadding#-4),#PanelRadius# | Fill Color 8,10,18,#PanelAlpha# | StrokeWidth 0
