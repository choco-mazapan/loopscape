; Loopscape settings. Loopscape notices changes to this file by itself.
; The widgets' Settings panel saves its choices in Documents\Rainmeter\Skins\Loopscape\@Resources\Settings.inc;
; those override the matching keys here.

; Video to loop when plugged in. Environment variables are allowed.
video=%USERPROFILE%\Loopscape\loop.mp4

; Rotate through these styles (names from the styles folder, or full paths), crossfading between them.
; Empty = every light style on this PC (when the Settings panel is set to Rotate). Only styles on this PC rotate;
; picking one that isn't downloads it. Switches are aligned to the clock (60 = on the hour).
rotate=
rotateMinutes=60
; Dark styles rotated instead of the list above between darkFrom and darkTo (24h HH:mm; may wrap past midnight).
; Empty = every dark style on this PC.
rotateDark=
darkFrom=19:00
darkTo=07:00
; Night window: fixed = darkFrom..darkTo, sun = sunset to sunrise (times from the weather widget)
nightMode=fixed
; Styles left out of the rotation (comma-separated)
exclude=
; 1 = match the weather while rotating: rain -> rain, clear night -> moon, overcast/fog -> clouds
weatherMode=0
; Global hotkey that skips to the next style (e.g. ctrl+alt+f9; none = off)
nextHotkey=win+alt+n
; Tray icon (click: widget settings; right-click: next / change wallpaper, quit). 0 = no icon
trayIcon=1
; The Settings panel's Wallpaper/Rotation tabs save WallExclude, WallRotateMinutes, WallNight, WallWeather,
; WallOnBattery and WallPauseCovered in the widgets' Settings.inc; those override the matching keys here.
; Length of the live crossfade between styles, in milliseconds
switchFadeMs=5000
; Crossfade when you pick a style yourself (Settings panel / tray menu), in milliseconds
manualFadeMs=1000

; What to do on battery:
;   static = switch straight to a still wallpaper and close the video player (no CPU/GPU/RAM use)
;            -> pick that wallpaper in Settings > Personalization > Background (use "Fill")
;   pause  = freeze the video on its current frame; resumes from that frame on AC (player stays open, ~150 MB RAM).
;            Hourly style changes still happen: crossfade to the next style, then freeze again.
;   play   = keep animating
onBattery=pause

; With onBattery=static: folder of still wallpapers (styles\make-stills.ps1). On battery the Windows wallpaper follows
; the same rotation as the video (dark styles at night too), showing a still of the current style. Unplugging stops
; the video immediately and shows that still. Leave empty to keep whatever Windows wallpaper you picked yourself.
; e.g. batteryStills=%USERPROFILE%\Pictures\Loopscape Stills
batteryStills=

; Crossfade length in milliseconds (0 = switch instantly)
fadeMs=1500

; Freeze the video while a maximized or fullscreen window hides the desktop
pauseWhenCovered=true

; true = always animate: keep the video playing on battery and behind maximized or fullscreen windows, whatever
; onBattery and pauseWhenCovered say (Pause animation in the tray still works). The tray menu's Always animate and
; Settings panel > Rotation > Always animate set WallAlwaysAnimate in the widgets' Settings.inc, which wins over this.
alwaysAnimate=false

; How often to check power / windows, in milliseconds
pollMs=1500

; Optional: full path to mpv.exe (auto-detected if empty)
mpv=

; Optional: extra mpv options, e.g. --speed=0.5
mpvArgs=

; On 4K (or any exact multiple of 1080p) screens, show the square-pixel styles with sharp 2x scaling, so they look as
; crisp as on a 1080p screen. Styles with round dots always use smooth scaling. false = smooth scaling for everything.
sharpScaling=true

; Video format of downloaded styles: auto (the smallest one your graphics chip plays by itself, so the CPU stays
; idle), av1 (smallest files; uses the CPU on graphics chips without AV1 support), hevc, or h264 (largest files).
; Changing it downloads the styles on disk again in that format. Also in the tray menu > Video format.
videoFormat=auto

; Folder with a git clone of Loopscape's source code; sync.ps1 fills it in. With it, Update Loopscape (tray menu and
; Settings panel > Look) gets the latest code from GitHub and runs sync.ps1 (update.ps1 in that folder). Empty = Update
; Loopscape opens the Releases page to download the newest installer. Nothing checks for updates by itself.
sourceFolder=

; Where missing styles are downloaded from (https only; empty = the address in styles.json next to Loopscape.exe)
stylesUrl=
